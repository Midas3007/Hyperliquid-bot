# HEVI - Futures Challenge Protocol v3.1 for Hyperliquid
# Every threshold the rules engine uses lives in this file (see PROTOCOL.md for the reasoning).
# Percent values are written as percents: 1.5 means 1.5%.
# The loader rejects unknown or missing keys, so a typo fails loudly instead of silently using a default.
# Values marked [OPEN Qn] are defaults waiting on an answer in PROTOCOL.md "Open questions".

version = "3.3"

[data]                       # Conventions
stale_after_min = 15         # older than this = FAIL for that check
funding_basis_h = 8          # Hyperliquid funds hourly; every funding number is shown as an 8h equivalent
funding_neutral_8h_pct = 0.01

[fees]                       # Module 7 cost model. Live rates come from Hyperliquid's userFees endpoint;
maker_pct = 0.015            # these are the fallbacks (Hyperliquid base tier).
taker_pct = 0.045
slippage_pct = 0.05          # C = maker + taker + slippage = 0.11% at base tier
slippage_on_tp = true        # TP is a market trigger, so its exit pays slippage too (v3.1, Q19)

[exchange]
min_order_usd = 10.0         # Hyperliquid minimum order value
max_leverage = 25            # protocol cap; the coin's own max (from its margin table) can be lower

[gate]                       # Module 1. x = BTC % change from the 00:00 UTC daily open
no_trade_at_or_below_pct = -4.0
half_risk_at_or_below_pct = -2.0
pump_at_or_above_pct = 3.0
pump_flags_needed = 2
pump_funding_8h_pct = 0.03            # "funding >= 0.03%/8h and rising"
pump_oi_rising_pct = 2.0              # Q7 (decided in v3.1) OI 24h change that counts as "rising"
pump_price_stall_pct = 0.5            # Q7 (decided in v3.1) |last completed 4H candle move| under this = "stalling"
pump_long_ratio_rise_pct = 10.0       # Q7 (decided in v3.1) whale L/S up this much vs 24h ago = "long ratio climbing"
wick_min_share = 0.5                  # rejection wick: upper wick >= 50% of the candle's range
wick_level_tol_pct = 0.2              # ... with the high within 0.2% of (or through) the level

[screener]                   # Module 2
sweep1_min_volume_usd = 50_000_000    # Q8 (decided in v3.1) Hyperliquid liquidity differs from Bybit/Bitget
sweep2_min_volume_usd = 100_000_000
sweep1_top_n = 5                      # top buy/sell ratios
sweep2_top_n = 3                      # top daily % change (momentum)
sweep3_top_n = 3                      # lowest buy/sell ratio, volume > sweep 1 minimum (sell flow, for shorts - v3.1, Q10)
max_day_drop_pct = 8.0                # down more than this on the UTC day = auto-skip
stablecoins = ["USDC", "USDT", "USDE", "USD1", "RLUSD", "FDUSD", "DAI", "PYUSD", "USDS", "TUSD", "USDH", "USDT0"]
unlock_check = false                  # v3.1: unlock skip dropped by decision (Q1). true = require calendar.toml data
unlock_min_supply_pct = 1.0           # unlock >= 1% of circulating supply ...
unlock_extra_h = 24                   # ... within the hold window + 24h = auto-skip
whale_autoskip_below = 1.0            # true whale L/S below 1:1 = auto-skip
cooldown_after_sl_h = 24
cooldown_repeat_window_d = 30
cooldown_repeat_count = 2
cooldown_repeat_h = 336               # 14 days
flow_window_min = 60                  # buy/sell ratio window (taker trades from the websocket)
flow_min_coverage_min = 30            # Q3 (decided in v3.1) less trade history than this = N/A

[deep_dive]                  # Module 3
adr_days = 14
atr_period = 14
news_articles = 3
whale_accounts = 200                  # v3.3: the most profitable active traders this month (v3.2: 60 largest accounts)
whale_min_account_usd = 100000        # v3.3: smaller accounts are ignored
whale_min_turnover = 0.5              # v3.3: month volume / account value below this = not actively trading perps
whale_max_turnover = 100.0            # v3.3: above this = market maker (its positions are inventory, not bets)
whale_list_refresh_h = 6              # v3.3: re-pick the 200 every 6h; their positions refresh every 10 min
whale_min_holders = 5                 # Q2 (decided in v3.1) fewer whales holding the coin = N/A
big_trade_window_min = 240            # v3.3 whale fallback: big taker orders over the last 4h ...
big_trade_min_usd = 10000.0           # ... an order counts as big at max($10k, 0.02% of the coin's 24h volume)
big_trade_vol_pct = 0.02
big_trade_min_orders = 5              # ... with at least 5 big orders; fewer = no whale reading
rv_window_h = 24                      # realized vol = stdev of hourly log returns over 24h ...
rv_lookback_d = 30                    # ... ranked against the last 30 days
vol_low_below_pct = 25                # Q6 (decided in v3.1) percentile bands; only EXTREME >= 85 comes from the protocol
vol_high_at_or_above_pct = 75
vol_extreme_at_or_above_pct = 85

[filters]                    # Module 3 hard filters
whale_min_ratio = 1.5
crowd_max_ratio = 2.5                 # only used if crowd data exists (Hyperliquid has none)
oi_flat_tolerance_pct = 1.0           # Q7 (decided in v3.1) OI 24h change within +/- this = "flat"
news_min_bullish = 2
min_net_rr = 3.0

[ranking]                    # Module 3, +1 each
whale_ratio = 2.0
net_rr = 4.0
tp_adr_mult = 1.0

[tp]                         # Module 4
front_run_min_pct = 0.2
front_run_atr_mult = 0.1
max_adr_mult = 1.2
structural_methods = ["SWING", "VP", "FIB"]   # Q5 (decided in v3.1) which 4H levels count as real structure
level_merge_pct = 0.15                       # levels this close together are one level

[direction]                  # Module 5. N/A counts as a fail everywhere.
long_whale_min = 1.5
long_funding_min_8h_pct = 0.0
long_funding_max_8h_pct = 0.03
long_fng_min = 50
short_whale_max = 0.7
short_funding_max_8h_pct = -0.03
short_fng_max = 40
reversal_needed = 2
reversal_funding_8h_pct = 0.03
reversal_oi_drop_pct = -5.0           # Q7 (decided in v3.1) "OI dropping sharply" ...
reversal_spike_pct = 3.0              # ... on a daily move of at least this
reversal_pump_pct = 5.0               # Q7 (decided in v3.1) "strong pump" for the whale-flip trigger
reversal_btc_fast_move_pct = 3.0

[entry]                      # Module 6
confluence_methods = ["BB", "VWAP", "FIB", "VP"]
min_methods = 3                       # v3.1 (Q4): 3 of the 4 methods must agree
confluence_tol_pct = 0.25
max_distance_pct = 1.0
cancel_after_h = 4
cancel_progress_to_tp = 0.5           # price covers half the way to TP unfilled = cancel

[risk]                       # Module 7
normal_pct = 10.0
half_pct = 5.0
ceiling_pct = 15.0
sl_min_pct = 1.5
sl_atr_buffer_mult = 0.25
leverage_buffer_pct = 2.0             # leverage = floor(1 / (SL% + MMR + 2%))
max_margin_of_available_pct = 80.0
liq_beyond_sl_pct = 1.5
loss_check_tolerance_pct = 5.0
funding_hold_h = 48                   # funding cost projected over the 48h time stop (stricter than a shorter guess)
micro_equity_below_usd = 6.0          # Q9 (decided in v3.1) micro phase: below this, risk may rise to the ceiling if the $10 minimum forces it

[breakers]                   # Module 8
half_risk_after_sl_streak = 2
pause_after_sl_streak = 3
pause_h = 48
dd_half_risk_pct = 30.0
dd_half_risk_until_within_pct = 15.0
dd_stop_pct = 50.0
dd_stop_days = 7
max_entries_per_day = 2
half_band_max_entries = 1

[schedule]                   # Module 9. All UTC.
entry_weekdays = [0, 1, 2, 3]         # Mon-Thu (Monday = 0)
friday_cancel_hour = 0
friday_flat_hour = 20
time_stop_h = 48
early_exit_btc_pct = 4.0
macro_events = ["CPI", "FOMC", "NFP"]

[execution]                  # Module 10
reissue_if_moved_pct = 0.3
card_ttl_min = 10

[review]                     # Module 11
every_n_trades = 20
recalibrate_lookback = 30
kelly_fraction = 0.5
no_edge_below_pct = 2.0
hypothesis_min_trades = 5
skip_check_after_h = 48
discretion_compare_after = 10

[commands]                   # Module 12
max_resweeps = 2

[autopilot]                  # v3.1: HEVI trades on its own (no 'y' needed). Every rule still applies.
enabled = true
scan_every_min = 30          # how often to look for a setup while flat, inside the entry window
warmup_min = 30              # after a restart, wait for the trade stream to fill (buy/sell ratio)
report_hour_utc = 21         # daily report
act_on_early_exits = true    # close on the objective early-exit triggers (logged as "early", compared with the bracket)
# Prove-then-live (MODE=prove, the default): HEVI paper-trades until its paper record shows an edge, then goes live.
go_live_min_trades = 10      # owner's choice (was 20): fewer trades of proof, sooner live
go_live_min_expectancy_r = 0.10
go_live_min_profit_factor = 1.2

[strategy]                   # v3.2: HOW HEVI hunts. The hard rules (Module 13: stop >= 1.5%, net R/R >= 1:3, TP at a
default = "multi"            # real 4H level, risk <= 15%, no Fri-Sun, breakers) are identical in every mode.
multi_day_btc_abs_move_pct = 2.0    # multi: BTC moved this far since the UTC open -> day, otherwise swing
multi_day_vol = ["HIGH", "EXTREME"] # ... or BTC volatility is this high -> day

[strategy.swing]             # the v3.1 protocol as written: selective, holds up to 48h, TP at a 4H level
hold_h = 48
max_adr_mult = 1.2           # TP reachable within 1.2 x 14-day ADR
na_is_miss = true            # a trigger with no data counts as a miss (protocol)
min_measurable = 5
min_measurable_short = 3
long_needed = 4              # long: 4 of 5 triggers
trend_short_needed = 2
long_buy_sell_min = 3.0
short_sell_buy_min = 3.0
news_optional_below = 0      # fewer rated headlines = N/A = fails

[strategy.day]               # same hard rules, quicker: holds up to 24h, TP within one day's range
hold_h = 24
max_adr_mult = 1.0
na_is_miss = false           # a trigger with no data is left out, not counted as a miss ...
min_measurable = 4           # ... but at least 4 of 5 long triggers must be measurable
min_measurable_short = 3
long_needed = 3              # long: 3 of the measurable triggers
trend_short_needed = 2
long_buy_sell_min = 2.5
short_sell_buy_min = 2.5
news_optional_below = 2      # under 2 headlines: no sentiment check; a thesis-breaking catalyst still blocks

[demo]                       # v3.3: ONE-DAY demo session (owner's request, Fri 13 Nov 2026) so the record page isn't empty.
# A separate $100 paper account with looser entry rules: whale/OI/news/direction filters are ignored, net R/R >= 1:1.5
# instead of 1:3, and no breakers. Stops, isolated sizing, liquidation buffer, BTC gate, EXTREME volatility, missing
# price data and the Friday 20:00 UTC flatten still apply. Its trades never count toward the go-live gate, the paper
# record or the breakers, and the page labels them DEMO. Once entries_until has passed this section does nothing.
entries_until = "2026-11-13T17:00:00Z"   # unfilled entries are cancelled from 17:00; everything flat by 20:00 UTC
min_net_rr = 1.5
max_adr_mult = 2.0
entry_min_methods = 2
max_entries = 4
scan_every_min = 15

[scalp]                      # v3.4 / scalp-0.1: BTC scalper, owner's request (19 Nov 2026). Separate protocol, own $100 paper
# ledger, own breakers, own gate. Never shares risk state with the swing daemon. Paper only: live needs an explicit owner command.
version = "scalp-0.2"
coin = "BTC"
enabled = true
paper_balance = 100.0
risk_pct = 3.0                        # of scalp equity at the stop (owner: higher exposure; ~16x notional on a 0.2% stop)
risk_cap_pct = 5.0
max_leverage = 40                     # BTC's Hyperliquid max; isolated, as high as the 3x liquidation buffer allows
margin_headroom = 1.5                 # isolated leverage = ceil(effective leverage x 1.5)
liq_buffer_mult = 3.0                 # reject unless liquidation is >= 3x the stop distance away
stop_min_pct = 0.20                   # stop band (the swing 1.5% floor does not apply: different timescale)
stop_max_pct = 0.60
stop_atr_mult = 0.8                   # stop >= 0.8 x 5m ATR
tp1_r = 1.0                           # half off at 1R NET of fees (targets are set in net R: never below 1:1), stop to break-even + fees
tp2_r = 2.0                           # rest at 2R net of fees ...
min_net_rr = 1.0                      # never a target below 1:1 net of costs
time_stop_min = 20                    # out if not +0.5R within 20 minutes (before TP1)
time_stop_r = 0.5
max_hold_min = 90
entry_timeout_min = 2                 # post-only limit; cancelled if not traded through within 2 one-minute bars
maker_pct = 0.015
taker_pct = 0.045
slippage_pct = 0.02                   # on stops and market exits
sessions_utc = [7, 11, 13, 17]        # trade 07-11 and 13-17 UTC, flat at each window end
macro_buffer_min = 10
atr_min_pct = 0.08                    # 5m ATR band: below = dead, above = chaos
atr_max_pct = 1.20
trend_slope_pct = 0.05                # 15m EMA20 slope over 3 bars
max_trades_day = 20
signal_tf = 1                         # signal timeframe in minutes (1, 3 or 5); fills are always checked on 1m
claude_veto = false                   # true = Claude may veto or shrink each entry (never enlarge); arm I tests it
daily_stop_r = -3.0
daily_lock_r = 4.0                    # at +4R the rest of the day runs at half risk
loss_streak_cooldown = 3
cooldown_min = 45
max_losses_day = 5
dd_half_pct = 5.0
dd_pause_pct = 10.0
gate_min_trades = 30                  # owner (19 Nov): 30 closed scalps before going live
gate_min_expectancy_r = 0.10
gate_min_profit_factor = 1.2

