<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#060605}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script>
// "What's next for Kiyoshi": the road ahead. A gold road runs to the horizon and the camera moves along it.
// Where Kiyoshi is today (on-chain, 5 Nov 2026), three scenarios for the next 30 days (clearly marked as
// scenarios), the features on the roadmap flying past, and an honest caveat. 44 s on score-riviera.py (72 BPM).
const P = new URLSearchParams(location.search)
const W = +(P.get('w') || 1920), H = +(P.get('h') || 1080)
const c = document.getElementById('c'); c.width = W; c.height = H
const g = c.getContext('2d')
const DUR = 44, BAR = 4 * 60 / 72
const BG = '#060605', INK = '#100e0a', GOLD = '#D4AF37', GOLD2 = '#F3D77A', WHITE = '#F4F4F0', SOFT = '#d4cec2', GREY = '#8C8C88', GREEN = '#7fbf8f'
const SERIF = 'Caladea, "Liberation Serif", serif', SANS = 'Inter, sans-serif', MONO = '"JetBrains Mono", monospace'
const TAU = Math.PI * 2
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const lerp = (a, b, k) => a + (b - a) * k
const smooth = (x) => { x = clamp(x); return x * x * x * (x * (x * 6 - 15) + 10) }
const inout = (t, a, b, f = .6) => smooth((t - a) / f) * (1 - smooth((t - b) / f))
const hash = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x) }
function txt(s, x, y, size, color, alpha = 1, o = {}) { if (alpha <= .003) return; g.save(); g.globalAlpha *= alpha; g.fillStyle = color; g.font = `${o.italic ? 'italic ' : ''}${o.weight || 400} ${size}px ${o.font || SERIF}`; g.textAlign = o.align || 'center'; g.textBaseline = 'middle'; if (o.spacing) g.letterSpacing = o.spacing + 'px'; g.fillText(s, x, y); g.restore() }
function dot(x, y, r, color, a = 1) { if (a <= 0) return; const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, color); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.save(); g.globalAlpha *= a; g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill(); g.restore() }
const NB = 13, A0 = Math.PI * 1.07, A1 = Math.PI * 1.93
function fan(cx, cy, r, color, a = 1, open = 1) { if (a <= 0) return; g.save(); g.globalAlpha *= a; g.fillStyle = color; const w = (A1 - A0) / NB
  for (let i = 0; i < NB; i++) { const s = A0 + i * w * open + .012, e = A0 + (i + 1) * w * open - .012 + (1 - open) * .03; g.beginPath(); g.moveTo(cx + Math.cos(s) * r * .06, cy + Math.sin(s) * r * .06); g.lineTo(cx + Math.cos(s) * r, cy + Math.sin(s) * r); g.lineTo(cx + Math.cos(e) * r, cy + Math.sin(e) * r); g.lineTo(cx + Math.cos(e) * r * .06, cy + Math.sin(e) * r * .06); g.fill() }
  g.strokeStyle = color; g.lineWidth = r * .05; g.beginPath(); g.arc(cx, cy + r * .05, r * .06, 0, TAU); g.stroke(); g.restore() }
function panel(x, y, w, h, a) { if (a <= 0) return; g.save(); g.globalAlpha *= a; g.fillStyle = 'rgba(16,14,10,.82)'; g.beginPath(); g.roundRect(x - w / 2, y - h / 2, w, h, 18); g.fill(); g.strokeStyle = 'rgba(212,175,55,.6)'; g.lineWidth = 1.5; g.stroke(); g.restore() }

// ---------- the road: a perspective grid to the horizon; the camera moves forward ----------
const HY = 560, F = 520, CAMH = 260
const camZ = (t) => t * 520 + 160 * Math.sin(t * .3) // always moving, gently breathing
function road(t) {
  const z0 = camZ(t)
  const sky = g.createLinearGradient(0, 0, 0, HY); sky.addColorStop(0, '#060605'); sky.addColorStop(1, '#2a2110'); g.fillStyle = sky; g.fillRect(0, 0, 1920, HY)
  dot(960, HY, 700, 'rgba(212,175,55,.22)'); dot(960, HY, 260, 'rgba(255,230,160,.3)')
  const fl = g.createLinearGradient(0, HY, 0, 1080); fl.addColorStop(0, '#1a150b'); fl.addColorStop(1, '#060605'); g.fillStyle = fl; g.fillRect(0, HY, 1920, 1080 - HY)
  g.save(); g.strokeStyle = GOLD
  // lines along the road
  for (let X = -2550; X <= 2550; X += 300) { g.globalAlpha = Math.abs(X) < 200 ? .7 : .28; g.lineWidth = Math.abs(X) < 200 ? 2.4 : 1.4
    g.beginPath(); g.moveTo(960 + X * F / 140, HY + CAMH * F / 140); g.lineTo(960, HY); g.stroke() }
  // lines across, scrolling toward us
  const SP = 400
  for (let k = 0; k < 40; k++) { const z = SP - ((z0 % SP) + SP) % SP + k * SP; if (z < 140) continue; const y = HY + CAMH * F / z; g.globalAlpha = clamp(1 - z / 14000) * .55; g.lineWidth = 1.2; g.beginPath(); g.moveTo(0, y); g.lineTo(1920, y); g.stroke() }
  g.restore()
  // markers on the timeline beside the road
  const MARK = [[6000, 'TODAY'], [14000, 'NOV 12 · THE REVIEW'], [20000, 'DECEMBER'], [26000, 'JANUARY'], [32000, '2027']]
  for (const [zW, label] of MARK) { const z = zW - z0; if (z < 2200 || z > 12000) continue; const s = F / z, x = 960 + 900 * s, y = HY + CAMH * s
    g.save(); g.globalAlpha = clamp(1 - z / 12000) * clamp((z - 2200) / 800); g.strokeStyle = GOLD2; g.lineWidth = Math.max(1, 6 * s); g.beginPath(); g.moveTo(x, y); g.lineTo(x, y - 900 * s); g.stroke(); g.restore()
    txt(label, x + 14 * s, y - 900 * s - 30 * s, Math.max(10, 90 * s), GOLD2, clamp(1 - z / 12000) * clamp((z - 2200) / 800), { font: MONO, weight: 600, align: 'left', spacing: 4 }) }
}

// ---------- the roadmap: cards that fly toward the camera along the road ----------
const ROADMAP = [
  ['Quote counter', 'Fewer refused trades on Textile'],
  ['Firm quote first', 'No more phantom gaps'],
  ['Finer sizing', 'The right size for every gap'],
  ['Smart sizing v2', 'Tuned on this week’s data'],
  ['New corridors', 'Added as Celo lists them'],
  ['The Genesis pass', 'For the fund’s members'],
]
function roadmap(t) {
  const lt = t - 7 * BAR
  ROADMAP.forEach(([title, sub], i) => {
    const q = (lt - i * 2.0) / 4.2; if (q < 0 || q > 1) return
    const z = lerp(3600, 420, Math.pow(q, .8)), s = F / z, side = i % 2 ? 1 : -1, x = 960 + side * 300 * s * 2.4, y = HY - 160 * s
    const w = 900 * s * 1.6, h = 300 * s * 1.6, a = clamp(q / .2) * (1 - clamp((q - .82) / .18))
    panel(x, y, w, h, a)
    txt(`0${i + 1}`, x - w / 2 + 40 * s * 1.6, y - h / 2 + 46 * s * 1.6, 34 * s * 1.6, GOLD, a, { font: MONO, weight: 600, align: 'left' })
    txt(title, x, y - 24 * s * 1.6, 78 * s * 1.6, WHITE, a, { weight: 700 })
    txt(sub, x, y + 56 * s * 1.6, 44 * s * 1.6, SOFT, a, { italic: true })
  })
  txt('ON THE ROADMAP', 960, 120, 30, GOLD, inout(t, 7 * BAR + .2, 11 * BAR - .4), { font: MONO, weight: 600, spacing: 12 })
  txt('planned, and decided at the Nov 12 review', 960, 170, 30, GREY, inout(t, 7 * BAR + .6, 11 * BAR - .4), { italic: true })
}

// ---------- overlays ----------
function intro(t) {
  fan(960, HY - 10, 150, GOLD, smooth(t / .8), smooth(t / 1.6))
  txt('WHAT’S NEXT', 960, 230, 34, GOLD, inout(t, .8, 6.0), { font: MONO, weight: 600, spacing: 14 })
  txt('for Kiyoshi', 960, 320, 96, WHITE, inout(t, 1.2, 6.0), { weight: 700 })
}
function today(t) {
  const lt = t - 2 * BAR
  const a = inout(t, 2 * BAR, 4 * BAR - .3)
  txt('TODAY · ON-CHAIN, 5 NOV', 960, 150, 30, GOLD, a, { font: MONO, weight: 600, spacing: 10 })
  const stats = [['$1.5642', 'share price, +56% since 29 Oct'], ['$384', 'in the fund'], ['1,887', 'round trips in 10 days'], ['~$13.5', 'a day, at today’s size']]
  stats.forEach(([v, l], i) => { const x = 360 + i * 400, k = smooth((lt - .3 - i * .35) / .5) * a
    panel(x, 330, 360, 220, k); txt(v, x, 300, 70, i === 0 ? GOLD2 : WHITE, k, { font: MONO, weight: 600 }); txt(l, x, 380, 24, GREY, k, { font: SANS }) })
}
function scenarios(t) {
  const lt = t - 4 * BAR, a = inout(t, 4 * BAR, 7 * BAR - .3)
  txt('THE NEXT 30 DAYS · THREE SCENARIOS', 960, 120, 30, GOLD, a, { font: MONO, weight: 600, spacing: 10 })
  txt('fund profit if the gaps…', 960, 170, 32, GREY, a, { italic: true })
  const S = [['shrink', 5, 150, '#8a7a5a'], ['hold at half', 10, 300, GOLD], ['stay like now', 15, 450, GOLD2]]
  S.forEach(([name, perDay, total, col], i) => { const x = 560 + i * 400, k = smooth((lt - .4 - i * .4) / .9) * a, h = 300 * (total / 450) * k, base = 520
    g.save(); g.globalAlpha = a; g.fillStyle = col; g.beginPath(); g.roundRect(x - 80, base - h, 160, h, 10); g.fill(); g.restore()
    txt(`+$${Math.round(total * k)}`, x, base - h - 40, 54, WHITE, a * smooth((lt - .6 - i * .4) / .5), { font: MONO, weight: 600 })
    txt(name, x, base + 40, 30, SOFT, a, { italic: true }); txt(`~$${perDay}/day`, x, base + 80, 24, GREY, a, { font: MONO }) })
  txt('Midas’s $1,000: somewhere between late December and late January', 960, 1000, 34, GREEN, inout(t, 4 * BAR + 3, 7 * BAR - .3), { font: SANS, weight: 600 })
}
function caveat(t) {
  const a = inout(t, 11 * BAR, 12 * BAR - .2)
  panel(960, 300, 1300, 300, a)
  txt('Scenarios, not promises.', 960, 230, 56, WHITE, a, { weight: 700 })
  txt('Built from ten days of trades. Gaps can shrink, competitors can grow,', 960, 310, 30, SOFT, a, { font: SANS })
  txt('and more money earns less per dollar. Past results don’t guarantee future returns.', 960, 355, 30, SOFT, a, { font: SANS })
}
function endCard(t) {
  const lt = t - 12 * BAR
  fan(960, 300, 150, GOLD, smooth(lt / .6), smooth(lt / 1.2))
  txt('MIDAS × KIYOSHI', 960, 470, 80, WHITE, smooth((lt - .4) / .6), { weight: 700, spacing: 18 })
  txt('the road ahead', 960, 545, 40, SOFT, smooth((lt - .9) / .6), { italic: true })
}
function draw(t) {
  g.setTransform(W / 1920, 0, 0, H / 1080, 0, 0)
  road(t)
  if (t < 2 * BAR + .5) intro(t)
  today(t); scenarios(t); roadmap(t); caveat(t)
  if (t > 12 * BAR - .2) endCard(t)
  g.setTransform(1, 0, 0, 1, 0, 0)
  const vg = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .4, W / 2, H / 2, Math.max(W, H) * .75); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.55)'); g.fillStyle = vg; g.fillRect(0, 0, W, H)
  g.globalAlpha = clamp(1 - t / .6) + clamp((t - (DUR - 1)) / 1); g.fillStyle = '#000'; g.fillRect(0, 0, W, H); g.globalAlpha = 1
}
window.draw = draw; window.DUR = DUR; window.READY = Promise.resolve()
</script>
</body></html>
