<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#070707}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script>
// Kiyoshi, Midas edition: a 60 s single-shot camera move through an engraved trading ledger.
// One continuous camera (no cuts) glides plate to plate, with parallax depth behind and in front.
// draw(t) is deterministic so render.cjs can capture it frame by frame (SCENE=desk-tour.html).
const P = new URLSearchParams(location.search)
const W = +(P.get('w') || 1920), H = +(P.get('h') || 1080)
const c = document.getElementById('c'); c.width = W; c.height = H
const g = c.getContext('2d')
const DUR = 60
const BG = '#070707', INK = '#0d0c0a', WHITE = '#F4F4F0', GREY = '#8C8C88', DIM = '#4a4740', GOLD = '#D4AF37', GOLD2 = '#F3D77A', RED = '#c8645a', GREEN = '#7fbf8f'
const SERIF = 'Caladea, "Liberation Serif", serif', SANS = 'Inter, sans-serif', MONO = '"JetBrains Mono", "DejaVu Sans Mono", monospace'

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const lerp = (a, b, k) => a + (b - a) * k
const smooth = (x) => { x = clamp(x); return x * x * x * (x * (x * 6 - 15) + 10) }
const easeOut = (x) => 1 - Math.pow(1 - clamp(x), 3)
const R = (s) => () => { s |= 0; s = (s + 0x6d2b79f5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296 }

// ---------- drawing helpers (world units) ----------
function txt(s, x, y, size, color, alpha = 1, o = {}) {
  if (alpha <= 0.002) return
  g.save(); g.globalAlpha *= alpha; g.fillStyle = color
  g.font = `${o.italic ? 'italic ' : ''}${o.weight || 400} ${size}px ${o.font || SANS}`
  g.textAlign = o.align || 'center'; g.textBaseline = o.base || 'alphabetic'
  if (o.spacing) g.letterSpacing = o.spacing + 'px'
  g.fillText(s, x, y); g.restore()
}
const typed = (s, k) => s.slice(0, Math.round(clamp(k) * s.length))
function line(x1, y1, x2, y2, color, w, alpha = 1) { g.save(); g.globalAlpha *= alpha; g.strokeStyle = color; g.lineWidth = w; g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); g.restore() }
function rrect(x, y, w, h, r, fill, stroke, lw = 2, alpha = 1) {
  g.save(); g.globalAlpha *= alpha; g.beginPath(); g.roundRect(x, y, w, h, r)
  if (fill) { g.fillStyle = fill; g.fill() } if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw; g.stroke() } g.restore()
}
function rosette(cx, cy, r, color, alpha, n = 14, a = 7, b = 0.6, lw = 1) {
  g.save(); g.globalAlpha *= alpha; g.strokeStyle = color; g.lineWidth = lw
  for (let j = 0; j < n; j++) { g.beginPath(); const ph = (j / n) * Math.PI * 2 / a
    for (let t = 0; t <= Math.PI * 2 + 0.02; t += 0.03) { const rr = r * (1 - b / 2 + (b / 2) * Math.cos(a * t + ph)); const x = cx + Math.cos(t) * rr, y = cy + Math.sin(t) * rr; t ? g.lineTo(x, y) : g.moveTo(x, y) }
    g.stroke() }
  g.restore()
}
function guilloche(x, y, w, h, color, alpha, waves = 10, lines = 6) {
  g.save(); g.globalAlpha *= alpha; g.strokeStyle = color; g.lineWidth = 1
  for (let j = 0; j < lines; j++) { g.beginPath(); for (let t = 0; t <= w; t += 6) { const yy = y + h / 2 + Math.sin((t / w) * Math.PI * waves + j * 0.7) * h * 0.42 * Math.cos(j * 0.35); t ? g.lineTo(x + t, yy) : g.moveTo(x + t, yy) } g.stroke() }
  g.restore()
}
function glow(pts, color, width, alpha) {
  g.save(); g.strokeStyle = color; g.lineJoin = g.lineCap = 'round'
  for (const [w, a] of [[width * 6, .07], [width * 3, .14], [width, 1]]) {
    g.globalAlpha = alpha * a; g.lineWidth = w; g.beginPath(); pts.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.stroke()
  }
  g.restore()
}
// Kiyoshi's fan: 13 wedge blades from a pivot, unfolding with p, the small lower fan and pivot ring
const NB = 13, A0 = Math.PI * 1.07, A1 = Math.PI * 1.93
function fan(cx, cy, r, p, color, alpha) {
  if (alpha <= 0) return
  g.save(); g.globalAlpha *= alpha; g.fillStyle = color
  const w = (A1 - A0) / NB
  for (let i = 0; i < NB; i++) {
    const gp = .011 * Math.min(1, p * 2.2), s = A0 + i * w * p + gp, e = A0 + (i + 1) * w * p - gp + (1 - p) * .03, ri = r * .06
    g.beginPath(); g.moveTo(cx + Math.cos(s) * ri, cy + Math.sin(s) * ri); g.lineTo(cx + Math.cos(s) * r, cy + Math.sin(s) * r)
    g.lineTo(cx + Math.cos(e) * r, cy + Math.sin(e) * r); g.lineTo(cx + Math.cos(e) * ri, cy + Math.sin(e) * ri); g.closePath(); g.fill()
  }
  if (p > .75) { const ha = A0 + (A1 - A0) * .82 * p; g.globalAlpha = alpha * clamp((p - .75) * 6); g.fillStyle = INK; g.beginPath(); g.arc(cx + Math.cos(ha) * r * .76, cy + Math.sin(ha) * r * .76, r * .075, 0, 7); g.fill() }
  g.globalAlpha = alpha; g.fillStyle = color; const lr = r * .13, ly = cy + r * .03
  for (let i = 0; i < 6; i++) { const s = Math.PI * (.12 + .76 * i / 6) + .04, e = Math.PI * (.12 + .76 * (i + 1) / 6) - .04
    g.beginPath(); g.moveTo(cx + Math.cos(s) * lr * .35, ly + Math.sin(s) * lr * .35); g.arc(cx, ly, lr, s, e); g.arc(cx, ly, lr * .35, e, s, true); g.closePath(); g.fill() }
  g.strokeStyle = color; g.lineWidth = lr * .14; g.beginPath(); g.arc(cx, ly, lr * .3, 0, 7); g.stroke()
  g.restore()
}

// ---------- the plates (each is a page of an engraved ledger), centred at their own origin ----------
const PW = 1000, PH = 1100
const ROMAN = ['', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII']
function plateFrame(i, k) {
  rrect(-PW / 2, -PH / 2, PW, PH, 18, INK, null, 0, k)
  g.save(); g.globalAlpha *= k
  g.save(); g.beginPath(); g.roundRect(-PW / 2, -PH / 2, PW, PH, 18); g.clip()
  rosette(-PW / 2, -PH / 2, 170, GOLD, .10, 16, 9, .55); rosette(PW / 2, PH / 2, 170, GOLD, .10, 16, 11, .55)
  g.restore()
  rrect(-PW / 2 + 18, -PH / 2 + 18, PW - 36, PH - 36, 10, null, GOLD, 1.6, .75)
  rrect(-PW / 2 + 28, -PH / 2 + 28, PW - 56, PH - 56, 6, null, GOLD, .7, .45)
  txt(`MIDAS × KIYOSHI · DESK LEDGER`, -PW / 2 + 60, -PH / 2 + 72, 15, GOLD, .8, { font: MONO, align: 'left', spacing: 3 })
  txt(`Nº ${String(i).padStart(4, '0')}`, PW / 2 - 60, -PH / 2 + 72, 15, GOLD, .8, { font: MONO, align: 'right', spacing: 3 })
  guilloche(-PW / 2 + 50, PH / 2 - 110, PW - 100, 34, GOLD, .22, 14, 5)
  g.restore()
}
function head(i, eyebrow, title, lt) {
  const k1 = smooth((lt + .7) / .6), k2 = smooth((lt + .45) / .7)
  txt(`ARTICLE ${ROMAN[i]} · ${eyebrow}`, -PW / 2 + 70, -PH / 2 + 160, 18, GOLD, k1, { font: MONO, align: 'left', spacing: 4 })
  txt(title, -PW / 2 + 68, -PH / 2 + 240, 66, WHITE, k2, { font: SERIF, align: 'left', weight: 700, spacing: 1 })
  line(-PW / 2 + 70, -PH / 2 + 275, -PW / 2 + 70 + 860 * easeOut((lt + .3) / 1), -PH / 2 + 275, GOLD, 1.4, .7 * k2)
}
function body(lines, lt, y0 = -PH / 2 + 330, start = .1, size = 30) {
  lines.forEach((s, j) => txt(s, -PW / 2 + 70, y0 + j * (size * 1.45), size, j === 0 ? WHITE : '#c9c5bb', smooth((lt - start - j * .18) / .5), { align: 'left' }))
}
function foot(s, lt) { txt(s, 0, PH / 2 - 52, 15, GREY, smooth((lt - .4) / .6), { font: MONO, spacing: 2 }) }
function stat(v, label, x, y, lt, d = 0, color = GOLD2, size = 74) {
  const k = smooth((lt - d) / .6)
  txt(v, x, y, size, color, k, { font: MONO, weight: 600, align: 'left' })
  txt(label, x, y + 34, 18, GREY, k, { font: MONO, align: 'left', spacing: 2 })
}
const money = (v, d = 2) => '$' + v.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d })

const HOURS = [9.49,9.94,2.34,5.37,2.09,4.07,2.73,0.82,1.84,7.25,2.32,8.75,10.43,31.04,48.23,9.53,6.18,4.52,2.95,5.46,13.75,11.68,8.62,6.88]
const WINDOW = (h) => (h === 13 || h === 14 ? 'peak' : [0, 1, 9, 11, 12, 20, 21].includes(h) ? 'busy' : 'quiet')

const PLATES = [
  { // 0 title
    draw(lt) {
      rrect(-PW / 2, -PH / 2, PW, PH, 18, INK, null, 0, 1)
      g.save(); g.beginPath(); g.roundRect(-PW / 2, -PH / 2, PW, PH, 18); g.clip(); rosette(0, -130, 470, GOLD, .09, 26, 13, .5); rosette(0, -130, 300, GOLD, .08, 18, 9, .6); g.restore()
      rrect(-PW / 2 + 18, -PH / 2 + 18, PW - 36, PH - 36, 10, null, GOLD, 1.6, .75)
      fan(0, -110, 250, smooth((lt + .2) / 2.2), GOLD, 1)
      txt('KIYOSHI', 0, 250, 132, WHITE, smooth((lt - .9) / .8), { font: SERIF, weight: 700, spacing: 22 })
      txt('MIDAS EDITION', 0, 318, 26, GOLD, smooth((lt - 1.3) / .7), { font: MONO, spacing: 12 })
      txt('The engine by Mel. The desk by Midas.', 0, 400, 34, '#c9c5bb', smooth((lt - 1.9) / .8), { font: SERIF, italic: true })
      guilloche(-PW / 2 + 50, PH / 2 - 110, PW - 100, 34, GOLD, .22, 14, 5)
    },
  },
  { // 1 the engine (Mel's)
    draw(lt, i) {
      plateFrame(i, 1); head(i, 'THE ENGINE', 'Two markets, one gap', lt)
      body(['Mel’s Kiyoshi watches Celo FX on two venues and', 'buys where a currency is cheaper, sells where it isn’t.'], lt)
      const x0 = -400, x1 = 400, yA = 60, prog = easeOut((lt - .2) / 2.4)
      const pts = (off, s) => { const a = []; for (let x = x0; x <= x0 + (x1 - x0) * prog; x += 8) a.push([x, yA + off + Math.sin(x / 70 + s) * 14 + Math.sin(x / 31 + s * 2) * 6]); return a }
      const A = pts(-55, 0), B = pts(55, 1.3)
      if (A.length > 1) { g.save(); g.globalAlpha = .18; g.fillStyle = GOLD; g.beginPath(); A.forEach(([x, y], j) => (j ? g.lineTo(x, y) : g.moveTo(x, y))); for (let j = B.length - 1; j >= 0; j--) g.lineTo(B[j][0], B[j][1]); g.closePath(); g.fill(); g.restore() }
      glow(A, WHITE, 2.4, .9); glow(B, GOLD2, 2.4, .9)
      txt('TEXTILE FX', x0, yA - 95, 17, WHITE, smooth((lt - .3) / .5), { font: MONO, align: 'left', spacing: 3 })
      txt('UNISWAP V3', x0, yA + 120, 17, GOLD2, smooth((lt - .3) / .5), { font: MONO, align: 'left', spacing: 3 })
      txt('the gap', 300, yA + 8, 24, GOLD, smooth((lt - 1.6) / .5), { font: SERIF, italic: true })
      const chips = ['wARS', 'cNGN', 'wBRL', 'USDC']
      chips.forEach((s, j) => { const k = smooth((lt - 1 - j * .15) / .4); rrect(-400 + j * 210, 260, 180, 64, 32, null, GOLD, 1.5, k); txt(s, -310 + j * 210, 302, 26, WHITE, k, { font: MONO }) })
      foot('ROUND TRIPS: USDT → LOCAL CURRENCY → USDT · CREDIT: MEL', lt)
    },
  },
  { // 2 always on
    draw(lt, i) {
      plateFrame(i, 1); head(i, 'ALWAYS ON', 'Runs in the cloud, 24/7', lt)
      body(['Hosted on Render (Frankfurt), not a phone.', 'Every update hands over safely: the old copy', 'finishes its trade before the new one starts.'], lt)
      const cx = 0, cy = 210, r = 190, a = -Math.PI / 2 + (lt + 2) * .9
      g.save(); g.strokeStyle = GOLD; g.globalAlpha = .9 * smooth((lt - .2) / .6); g.lineWidth = 2; g.beginPath(); g.arc(cx, cy, r, 0, 7); g.stroke()
      for (let h = 0; h < 24; h++) { const t = h / 24 * Math.PI * 2 - Math.PI / 2; line(cx + Math.cos(t) * (r - 16), cy + Math.sin(t) * (r - 16), cx + Math.cos(t) * r, cy + Math.sin(t) * r, GOLD, h % 6 ? 1 : 3, .8) }
      g.restore()
      glow([[cx, cy], [cx + Math.cos(a) * (r - 30), cy + Math.sin(a) * (r - 30)]], GOLD2, 3, smooth((lt - .3) / .5))
      txt('24h', cx, cy + 70, 30, WHITE, smooth((lt - .5) / .5), { font: MONO })
      txt('LIVE', cx + 300, cy - 120, 22, GREEN, smooth((lt - .8) / .5) * (.6 + .4 * Math.sin(lt * 6)), { font: MONO, spacing: 4 })
      foot('RENDER WORKER · 1 GB DISK FOR THE LEDGER · AUTO-DEPLOY', lt)
    },
  },
  { // 3 the fund's desk
    draw(lt, i) {
      plateFrame(i, 1); head(i, 'THE FUND’S DESK', 'Settles with the vault', lt)
      body(['Trading pauses for the daily settlement at 20:07 UTC,', 'so deposits and withdrawals always find the cash.', '“Settle now” on the site, signed by the manager.'], lt)
      const y = 130, x0 = -400, x1 = 400, k = easeOut((lt - .1) / 1.4)
      line(x0, y, x0 + (x1 - x0) * k, y, GOLD, 2, .9)
      for (let h = 0; h <= 24; h += 3) { const x = x0 + (x1 - x0) * h / 24; line(x, y - 10, x, y + 10, GOLD, 1.5, .8 * k); txt(String(h).padStart(2, '0'), x, y + 40, 18, GREY, k, { font: MONO }) }
      const xs = x0 + (x1 - x0) * (20 + 7 / 60) / 24, ks = smooth((lt - 1) / .5)
      rrect(xs - 26, y - 60, 70, 120, 8, 'rgba(212,175,55,.18)', GOLD, 1.5, ks)
      txt('20:07', xs + 10, y - 78, 22, GOLD2, ks, { font: MONO, weight: 600 })
      txt('PAUSE · SETTLE · RESUME', xs - 60, y + 92, 15, GOLD, ks, { font: MONO, spacing: 2 })
      const kb = smooth((lt - 1.6) / .5), press = clamp((lt - 2.4) / .25) * (1 - clamp((lt - 2.8) / .3))
      rrect(-170, 250 + press * 4, 340, 86, 43, GOLD, null, 0, kb); txt('SETTLE NOW', 0, 305 + press * 4, 30, '#1b1407', kb, { font: MONO, weight: 600, spacing: 4 })
      txt('✓ signed by the manager wallet', 0, 380, 24, GREEN, smooth((lt - 2.8) / .4), { font: SANS })
      foot('FUNDVAULT ON CELO · KEEPER RUNS HOURLY AT :07', lt)
    },
  },
  { // 4 reports in
    draw(lt, i) {
      plateFrame(i, 1); head(i, 'IT REPORTS IN', 'A heartbeat, and a phone', lt)
      body(['Every 5 minutes the bot reports in, signed by its wallet.', 'Telegram alerts if it goes quiet, keeps failing,', 'the share price drops, or settlement slips.'], lt)
      const pts = [], n = easeOut((lt - .1) / 2.2) * 800
      for (let x = 0; x <= n; x += 4) { const ph = (x % 200) / 200; const yv = ph > .42 && ph < .5 ? -90 * Math.sin((ph - .42) / .08 * Math.PI) : ph > .5 && ph < .56 ? 40 * Math.sin((ph - .5) / .06 * Math.PI) : 0; pts.push([-400 + x, 120 + yv]) }
      if (pts.length > 1) glow(pts, GOLD2, 2.6, .95)
      const kb = smooth((lt - 1.5) / .5)
      rrect(-360, 250, 720, 120, 22, '#1a1914', '#2c2a24', 1.5, kb)
      txt('✅ OK again: the bot is reporting.', -330, 300, 26, WHITE, kb, { align: 'left' })
      txt('fund-alerts · Telegram · now', -330, 342, 18, GREY, kb, { font: MONO, align: 'left' })
      foot('/status · /today · /queue · /keeper', lt)
    },
  },
  { // 5 gas
    draw(lt, i) {
      plateFrame(i, 1); head(i, 'PAYS ITS OWN GAS', 'Never runs dry', lt)
      body(['Below 0.5 CELO, it buys exactly $0.50 of CELO', 'with USDT, by itself. The cost is shared by every', 'holder through the fund’s value. Alert below 1 CELO.'], lt)
      const x0 = -380, w = 760, y = 160, h = 70
      const lvl = lt < 1.6 ? lerp(1.4, 0.48, smooth((lt + .2) / 1.8)) : lerp(0.48, 7.4, smooth((lt - 1.6) / .9))
      const frac = clamp(lvl / 8)
      rrect(x0, y, w, h, 12, null, GOLD, 1.5, smooth((lt + .3) / .5))
      rrect(x0 + 6, y + 6, Math.max(8, (w - 12) * frac), h - 12, 8, lvl < .5 ? RED : GOLD, null, 0, smooth((lt + .3) / .5))
      for (const [v, s] of [[0.5, '0.5'], [1, '1'], [7.4, '~7.4']]) { const x = x0 + w * v / 8; line(x, y - 14, x, y + h + 14, GREY, 1, .7); txt(s, x, y + h + 44, 18, GREY, smooth((lt) / .5), { font: MONO }) }
      txt(`${lvl.toFixed(2)} CELO`, 0, y - 34, 38, lvl < .5 ? RED : GOLD2, smooth(lt / .5), { font: MONO, weight: 600 })
      txt('⛽ bought 7.4 CELO for $0.50', 0, 380, 26, WHITE, smooth((lt - 2.3) / .4))
      foot('AT MOST ONE TOP-UP AN HOUR · TELEGRAM SAYS EACH TIME', lt)
    },
  },
  { // 6 skip stale quotes
    draw(lt, i) {
      plateFrame(i, 1); head(i, 'NO STALE QUOTES', 'Skip the wait, rescan', lt)
      body(['After a trade Textile holds the bot’s USDT for ~2 min.', 'Instead of waiting and trading on old prices,', 'it skips and rescans fresh. Switch: /skipwait.'], lt)
      const cx = -180, cy = 210, r = 120, run = clamp((lt - .2) / 1.3)
      g.save(); g.globalAlpha = smooth((lt) / .5); g.strokeStyle = DIM; g.lineWidth = 14; g.beginPath(); g.arc(cx, cy, r, 0, 7); g.stroke()
      g.strokeStyle = GOLD; g.beginPath(); g.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + run * Math.PI * 2 * .3); g.stroke(); g.restore()
      txt(`${Math.round(120 - run * 12)}s`, cx, cy + 14, 40, WHITE, smooth(lt / .5), { font: MONO, weight: 600 })
      txt('RESERVED', cx, cy + 54, 15, GREY, smooth(lt / .5), { font: MONO, spacing: 3 })
      const ks = smooth((lt - 1.4) / .4)
      line(cx - r - 20, cy + r + 20, cx + r + 20, cy - r - 20, RED, 6, ks)
      const ka = easeOut((lt - 1.7) / .7)
      glow([[0, cy], [80 + 160 * ka, cy]], GOLD2, 3, ka)
      txt('RESCAN', 330, cy + 12, 34, GOLD2, smooth((lt - 2.1) / .4), { font: MONO, weight: 600, spacing: 3 })
      foot('FIRST LEG ONLY: NOTHING BOUGHT YET, NOTHING AT RISK', lt)
    },
  },
  { // 7 analysis: the totals
    draw(lt, i) {
      plateFrame(i, 1); head(i, 'THE ANALYSIS', 'Ten days, every trade', lt)
      body(['3,707 round trips rebuilt from the chain,', 'Oct 25 – Nov 5, both desks side by side.'], lt)
      const cnt = (v) => v * easeOut((lt - .5) / 1.6)
      stat(money(cnt(304.42)), 'MIDAS DESK · 1,887 TRIPS', -400, 120, lt, .4)
      stat(money(cnt(301.27)), 'MEL’S DESK · 1,820 TRIPS', 60, 120, lt, .55, WHITE)
      txt('Both near $300. Same engine, two desks.', -400, 250, 28, '#c9c5bb', smooth((lt - 1.6) / .5), { align: 'left', font: SERIF, italic: true })
      stat('~$13.5/day', 'MIDAS, AFTER THE WBRL WINDFALL', -400, 360, lt, 2, GOLD2, 46)
      stat('~$9.5/day', 'MEL, SAME PERIOD', 60, 360, lt, 2.15, WHITE, 46)
      foot('58–70% OF THE TEN-DAY PROFIT CAME FROM ONE WBRL MISPRICING ON OCT 25–26', lt)
    },
  },
  { // 8 analysis: hours
    draw(lt, i) {
      plateFrame(i, 1); head(i, 'WHEN THE MONEY COMES', '37% in two hours', lt)
      body(['13:00–14:59 Lagos, as Latin American FX opens:', 'gaps of 9–11 bps instead of the usual ~3.'], lt)
      const x0 = -400, w = 800, base = 380, hmax = 300, bw = w / 24
      HOURS.forEach((v, h) => {
        const k = easeOut((lt - .3 - h * .04) / .6), hh = (v / 48.23) * hmax * k, peak = h === 13 || h === 14
        rrect(x0 + h * bw + 4, base - hh, bw - 8, hh, 3, peak ? GOLD2 : '#5d574b', null, 0, 1)
        if (h % 3 === 0) txt(String(h).padStart(2, '0'), x0 + h * bw + bw / 2, base + 32, 16, GREY, smooth((lt - .3) / .5), { font: MONO })
      })
      txt('$79.27', x0 + 13.5 * bw + bw / 2 + 4, base - hmax - 26, 30, GOLD2, smooth((lt - 1.6) / .5), { font: MONO, weight: 600 })
      foot('PROFIT BY LAGOS HOUR, BOTH DESKS, OCT 27 – NOV 5', lt)
    },
  },
  { // 9 analysis: gaps and size
    draw(lt, i) {
      plateFrame(i, 1); head(i, 'WHERE PROFIT LIVES', 'A few trades do the work', lt)
      body(['26% of trades made 98% of the profit.', 'Trades under 3¢ lost $19.94 together.', 'Slippage ≈ 0.58 bps per $100, so best size ≈ gap × $1.72M ÷ 2.'], lt, undefined, .1, 28)
      const y = 220, x0 = -400, w = 800, k = easeOut((lt - .6) / 1.2)
      rrect(x0, y, w * .26 * k, 70, 8, GOLD2, null, 0, 1); rrect(x0 + w * .26 * k + 6, y, (w * .74 - 6) * k, 70, 8, '#3a362e', null, 0, 1)

      txt('74%: SMALL OR NEGATIVE', x0 + w - 14, y + 44, 20, GREY, smooth((lt - 1.4) / .4), { font: MONO, align: 'right' })

      rrect(-PW / 2 + 18, -PH / 2 + 18, PW - 36, PH - 36, 10, null, GOLD, 1.6, .75)

// ---------- layout in the world and the camera path ----------
const STEP = 1450
const YS = [0, -330, 260, -240, 320, -280, 220, -320, 260, -200, 300, -260, 0]
const POS = PLATES.map((_, i) => [i * STEP, YS[i]])
const TITLE_HOLD = 3.6, TRAVEL = 1.05, HOLD = 3.55
const ARRIVE = PLATES.map((_, i) => (i === 0 ? 0 : TITLE_HOLD + (i - 1) * (TRAVEL + HOLD) + TRAVEL))
const LEAVE = PLATES.map((_, i) => (i === 0 ? TITLE_HOLD : i === PLATES.length - 1 ? DUR + 1 : ARRIVE[i] + HOLD))
// raw camera: drift slowly across each plate while holding, glide between plates; then smoothed in time
function rawCam(t) {
  for (let i = 0; i < PLATES.length; i++) {
    const [x, y] = POS[i], drift = 34
    if (t <= LEAVE[i]) {
      if (t >= ARRIVE[i] || i === 0) { const k = clamp((t - ARRIVE[i]) / (LEAVE[i] - ARRIVE[i])); return { x: x - drift + 2 * drift * k, y: y + (i % 2 ? 10 : -10) * (k - .5), z: 1 + .045 * k, r: (i % 2 ? -1 : 1) * .006 * (k - .5), tr: 0 } }
      const [px, py] = POS[i - 1], k = smooth((t - LEAVE[i - 1]) / TRAVEL)
      return { x: lerp(px + 34, x - 34, k), y: lerp(py, y, k), z: lerp(1.045, 1, k) * (1 - .2 * Math.sin(Math.PI * k)), r: .03 * Math.sin(Math.PI * k) * (i % 2 ? 1 : -1), tr: Math.sin(Math.PI * k) }
    }
  }
  const [x, y] = POS[PLATES.length - 1]; return { x, y, z: 1, r: 0, tr: 0 }
}
function camera(t) { // average the raw path over a short window: smooth starts and stops, never a cut
  const n = 9, win = .32, o = { x: 0, y: 0, z: 0, r: 0, tr: 0 }
  for (let j = 0; j < n; j++) { const c0 = rawCam(t + (j / (n - 1) - .5) * 2 * win); for (const k in o) o[k] += c0[k] / n }
  if (t < 1.2) o.z *= lerp(1.35, 1, smooth(t / 1.2)) // opening push-out from the fan
  return o
}

// ---------- parallax layers ----------
const rng = R(11)
const FAR = Array.from({ length: 40 }, () => [rng() * STEP * 14 - STEP, (rng() - .5) * 3200, 160 + rng() * 380, 7 + Math.floor(rng() * 8)])
const DUST = Array.from({ length: 160 }, () => [rng() * STEP * 14 - STEP, (rng() - .5) * 2600, 1 + rng() * 3, rng()])
const TICKS = ['MKF ▲ +50.8%', 'USDT/wARS 1,664.3', 'USDT/cNGN 1,381.9', 'USDT/wBRL 5.43', 'CELO 0.0764', 'GOLD 4,012', 'UST10Y 4.21%', 'SPX 6,904', 'KIYOSHI ▲ 3,707 TRIPS']
function layer(cam, f, fn) {
  const zoom = (Math.min(W, H) / 1250) * (1 + (cam.z - 1) * f) * (0.55 + 0.45 * f)
  g.save(); g.translate(W / 2, H / 2); g.rotate(cam.r * f); g.scale(zoom, zoom); g.translate(-cam.x * f, -cam.y * f); fn(zoom); g.restore()
}

const grainC = document.createElement('canvas'); grainC.width = grainC.height = 256
{ const gx = grainC.getContext('2d'), id = gx.createImageData(256, 256), r2 = R(5); for (let i = 0; i < id.data.length; i += 4) { const v = r2() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 14 } gx.putImageData(id, 0, 0) }

function draw(t) {
  const cam = camera(t)
  g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = BG; g.fillRect(0, 0, W, H)
  // far: engraved rosettes and a ledger grid, moving slowly
  layer(cam, .3, () => {
    for (const [x, y, r, a] of FAR) rosette(x, y, r, GOLD, .05, 10, a, .55, 1.2)
    g.save(); g.strokeStyle = GOLD; g.globalAlpha = .045; g.lineWidth = 1.5
    const x0 = Math.floor((cam.x * .3 - 4000) / 200) * 200
    for (let x = x0; x < x0 + 8000; x += 200) { g.beginPath(); g.moveTo(x, -3000); g.lineTo(x, 3000); g.stroke() }
    for (let y = -3000; y <= 3000; y += 200) { g.beginPath(); g.moveTo(x0, y); g.lineTo(x0 + 8000, y); g.stroke() }
    g.restore()
  })
  // mid: two ticker tapes and faint candles
  layer(cam, .62, () => {
    for (const [yy, dir] of [[-820, 1], [840, -1]]) {
      g.save(); g.globalAlpha = .5; g.fillStyle = '#0f0e0b'; g.fillRect(cam.x * .62 - 5000, yy - 34, 10000, 58); g.restore()
      line(cam.x * .62 - 5000, yy - 34, cam.x * .62 + 5000, yy - 34, GOLD, 1, .35); line(cam.x * .62 - 5000, yy + 24, cam.x * .62 + 5000, yy + 24, GOLD, 1, .35)
      g.save(); g.font = `500 26px ${MONO}`; g.textBaseline = 'middle'; g.fillStyle = GOLD; g.globalAlpha = .55
      let x = Math.floor((cam.x * .62 - 5200) / 3000) * 3000 + dir * (t * 70 % 3000)
      while (x < cam.x * .62 + 5200) { for (const s of TICKS) { g.fillText(s, x, yy - 4); x += g.measureText(s).width + 70 } }
      g.restore()
    }
    const r3 = R(Math.floor(cam.x / 4000) + 3)
    g.save(); g.globalAlpha = .08
    for (let k = 0; k < 60; k++) { const x = cam.x * .62 - 3000 + k * 100, o = r3() * 300 - 150, h = 40 + r3() * 160; g.fillStyle = r3() > .4 ? GREEN : RED; g.fillRect(x, 520 + o, 34, h); g.fillRect(x + 15, 500 + o, 4, h + 40) }
    g.restore()
  })
  // the plates
  layer(cam, 1, () => {
    PLATES.forEach((p, i) => {
      const [x, y] = POS[i]
      if (Math.abs(x - cam.x) > STEP * 1.6) return
      const lt = t - ARRIVE[i]
      g.save(); g.translate(x, y)
      g.shadowColor = 'rgba(0,0,0,.7)'; g.shadowBlur = 60; g.fillStyle = INK; g.beginPath(); g.roundRect(-PW / 2, -PH / 2, PW, PH, 18); g.fill(); g.shadowBlur = 0
      p.draw(lt, i)
      g.restore()
    })
    // gold thread joining the plates: the camera's route
    g.save(); g.globalAlpha = .35; g.strokeStyle = GOLD; g.lineWidth = 2; g.setLineDash([4, 14]); g.beginPath()
    POS.forEach(([x, y], i) => { if (i) { const [px, py] = POS[i - 1]; g.moveTo(px + PW / 2, py); g.bezierCurveTo(px + PW / 2 + 200, py, x - PW / 2 - 200, y, x - PW / 2, y) } }); g.stroke(); g.restore()
  })
  // near: gold dust drifting past the lens, brighter while the camera travels
  layer(cam, 1.6, () => {
    g.save(); g.fillStyle = GOLD2
    for (const [x, y, r, a] of DUST) { if (Math.abs(x - cam.x * 1.6) > 2200) continue; g.globalAlpha = (.12 + .25 * cam.tr) * (.4 + .6 * Math.sin(t * 1.3 + a * 9) ** 2); g.beginPath(); g.arc(x, y + Math.sin(t * .5 + a * 6) * 30, r * (1 + cam.tr * 1.5), 0, 7); g.fill() }
    g.restore()
  })
  // lens: vignette, a gentle motion streak on travel, grain
  g.setTransform(1, 0, 0, 1, 0, 0)
  const vg = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .35, W / 2, H / 2, Math.max(W, H) * .75)
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.78)'); g.fillStyle = vg; g.fillRect(0, 0, W, H)
  g.globalAlpha = 1; const gp = g.createPattern(grainC, 'repeat'); g.save(); g.translate((t * 997) % 256, (t * 613) % 256); g.fillStyle = gp; g.fillRect(-256, -256, W + 512, H + 512); g.restore()
  g.globalAlpha = clamp(1 - t / .6) + clamp((t - (DUR - .8)) / .8); g.fillStyle = '#000'; g.fillRect(0, 0, W, H); g.globalAlpha = 1
}
window.draw = draw; window.DUR = DUR
draw(+(P.get('t') || 2))
