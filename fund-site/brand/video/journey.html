<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#070706}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script>
// "The road to $1,000": Midas's own journey on Kiyoshi, vertical 1080 x 1920, 37.5 s, on score-possible.py
// (84 BPM: a bar is 2.857 s). Every number is from the chain as of 5 Nov 2026 (vault 0xd484…f1c4):
// share price per day from the vault's value reports; Midas's 234.24 shares; $239.44 put in.
const P = new URLSearchParams(location.search)
const W = +(P.get('w') || 1080), H = +(P.get('h') || 1920)
const c = document.getElementById('c'); c.width = W; c.height = H
const g = c.getContext('2d')
const DUR = 37.5, BEAT = 60 / 84, BAR = 4 * BEAT
const BG = '#070706', INK = '#100e0a', GOLD = '#D4AF37', GOLD2 = '#F3D77A', WHITE = '#F4F4F0', SOFT = '#d4cec2', GREY = '#8C8C88', GREEN = '#7fbf8f'
const SERIF = 'Caladea, "Liberation Serif", serif', SANS = 'Inter, sans-serif', MONO = '"JetBrains Mono", monospace'
const TAU = Math.PI * 2
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const lerp = (a, b, k) => a + (b - a) * k
const smooth = (x) => { x = clamp(x); return x * x * x * (x * (x * 6 - 15) + 10) }
const inout = (t, a, b, f = .5) => smooth((t - a) / f) * (1 - smooth((t - b) / f))
const R = (s) => () => { s |= 0; s = (s + 0x6d2b79f5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296 }
const money = (v, d = 2) => '$' + v.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d })

// ---------- the numbers ----------
const DAYS = [['Oct 29', 1.0020], ['Oct 30', 1.2120], ['Oct 31', 1.2460], ['Nov 1', 1.2996], ['Nov 2', 1.4235], ['Nov 3', 1.4606], ['Nov 4', 1.5072], ['Nov 5', 1.5642]]
const SHARES = 234.24, PUT_IN = 239.44, VALUE = SHARES * 1.5642, MADE = VALUE - PUT_IN, GOAL = 1000
const PACE_WEEK = SHARES * (1.5642 - 1.0020) / 7, PACE_RECENT = SHARES * (1.5642 - 1.4235) / 3
const MILESTONES = [[0, 'The fund opens at $1.00'], [1, '+21% in its first full day'], [3, 'Kiyoshi moves to the cloud'], [4, 'Monday: Latin America opens'], [7, 'Smart sizing switched on']]

function txt(s, x, y, size, color, alpha = 1, o = {}) { if (alpha <= .003) return; g.save(); g.globalAlpha *= alpha; g.fillStyle = color; g.font = `${o.italic ? 'italic ' : ''}${o.weight || 400} ${size}px ${o.font || SERIF}`; g.textAlign = o.align || 'center'; g.textBaseline = 'middle'; if (o.spacing) g.letterSpacing = o.spacing + 'px'; g.fillText(s, x, y); g.restore() }
function dot(x, y, r, color, a = 1) { if (a <= 0) return; const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, color); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.save(); g.globalAlpha *= a; g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill(); g.restore() }
function glow(pts, color, w, a) { if (a <= 0 || pts.length < 2) return; g.save(); g.strokeStyle = color; g.lineJoin = g.lineCap = 'round'; for (const [k, al] of [[7, .06], [3, .16], [1, 1]]) { g.globalAlpha = a * al; g.lineWidth = w * k; g.beginPath(); pts.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.stroke() } g.restore() }
const NB = 13, A0 = Math.PI * 1.07, A1 = Math.PI * 1.93
function fan(cx, cy, r, color, a = 1, open = 1) { if (a <= 0) return; g.save(); g.globalAlpha *= a; g.fillStyle = color; const w = (A1 - A0) / NB
  for (let i = 0; i < NB; i++) { const s = A0 + i * w * open + .012, e = A0 + (i + 1) * w * open - .012 + (1 - open) * .03; g.beginPath(); g.moveTo(cx + Math.cos(s) * r * .06, cy + Math.sin(s) * r * .06); g.lineTo(cx + Math.cos(s) * r, cy + Math.sin(s) * r); g.lineTo(cx + Math.cos(e) * r, cy + Math.sin(e) * r); g.lineTo(cx + Math.cos(e) * r * .06, cy + Math.sin(e) * r * .06); g.fill() }
  g.strokeStyle = color; g.lineWidth = r * .05; g.beginPath(); g.arc(cx, cy + r * .05, r * .06, 0, TAU); g.stroke(); g.restore() }

// ---------- scenes on a tall page; the camera moves down it ----------
function title(t) { // 0 - 5.7 s
  fan(540, 330, 150, GOLD, smooth(t / .6), smooth(t / 1.4))
  txt('THE ROAD TO', 540, 560, 40, GOLD, smooth((t - .6) / .6), { font: MONO, weight: 600, spacing: 12 })
  txt('$1,000', 540, 700, 210, WHITE, smooth((t - 1) / .7), { weight: 700 })
  txt('on Kiyoshi', 540, 840, 58, SOFT, smooth((t - 1.7) / .6), { italic: true })
  txt('Midas · since 25 October 2026', 540, 930, 30, GREY, smooth((t - 2.4) / .6), { font: SANS })
}
const CH = { x0: 110, x1: 970, y0: 1720, y1: 2520, lo: .95, hi: 1.62 }
const cx = (i) => lerp(CH.x0, CH.x1, i / (DAYS.length - 1)), cy = (p) => lerp(CH.y1, CH.y0, (p - CH.lo) / (CH.hi - CH.lo))
function chart(t) { // 5.7 - 20 s: the share price, day by day
  const lt = t - 2 * BAR
  txt('THE SHARE PRICE', 540, 1560, 30, GOLD, smooth((lt + .3) / .6), { font: MONO, weight: 600, spacing: 10 })
  txt('one share of the fund, day by day', 540, 1615, 32, GREY, smooth((lt) / .6), { italic: true })
  g.save(); g.globalAlpha = smooth(lt / .6)
  for (const p of [1, 1.2, 1.4, 1.6]) { const y = cy(p); g.strokeStyle = 'rgba(212,175,55,.14)'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(CH.x0, y); g.lineTo(CH.x1, y); g.stroke(); txt('$' + p.toFixed(2), CH.x0 - 16, y, 22, GREY, 1, { font: MONO, align: 'right' }) }
  g.restore()
  const prog = clamp((lt - .6) / 11) * (DAYS.length - 1) // one day every ~1.6 s
  const pts = []; for (let i = 0; i <= Math.floor(prog); i++) pts.push([cx(i), cy(DAYS[i][1])])
  const f = prog - Math.floor(prog), j = Math.floor(prog)
  if (j < DAYS.length - 1) pts.push([lerp(cx(j), cx(j + 1), f), lerp(cy(DAYS[j][1]), cy(DAYS[j + 1][1]), f)])
  // gold wash under the line
  if (pts.length > 1) { g.save(); g.beginPath(); g.moveTo(pts[0][0], CH.y1); pts.forEach(([x, y]) => g.lineTo(x, y)); g.lineTo(pts[pts.length - 1][0], CH.y1); g.closePath(); const wg = g.createLinearGradient(0, CH.y0, 0, CH.y1); wg.addColorStop(0, 'rgba(212,175,55,.32)'); wg.addColorStop(1, 'rgba(212,175,55,0)'); g.fillStyle = wg; g.fill(); g.restore() }
  glow(pts, GOLD2, 3.2, 1)
  const tip = pts[pts.length - 1]; if (tip) { dot(tip[0], tip[1], 46, 'rgba(255,240,190,.85)'); const price = j < DAYS.length - 1 ? lerp(DAYS[j][1], DAYS[j + 1][1], f) : DAYS[j][1]
    txt('$' + price.toFixed(4), 540, 1440, 120, WHITE, smooth(lt / .6), { weight: 700 }) }
  DAYS.forEach(([d], i) => { if (i % 2 === 0 || i === DAYS.length - 1) txt(d, cx(i), CH.y1 + 46, 24, GREY, smooth((prog - i + .5) / .5), { font: MONO }) })
  // milestones pop as the line reaches them
  MILESTONES.forEach(([i, s], k) => { const a = smooth((prog - i) / .4) * (k === MILESTONES.length - 1 || prog < MILESTONES[Math.min(k + 1, MILESTONES.length - 1)][0] + .9 ? 1 : .35)
    if (a <= 0) return; const x = cx(i), y = cy(DAYS[i][1]); dot(x, y, 20, 'rgba(243,215,122,.95)', a)
    txt(s, 540, 2660, 44, SOFT, a * (prog < (MILESTONES[k + 1]?.[0] ?? 99) ? 1 : 0), { italic: true }) })
  txt('+56% since the fund opened', 540, 2760, 40, GREEN, smooth((lt - 12.2) / .6), { font: SANS, weight: 600 })
}
function goal(t) { // 20 - 28.6 s: the goal bar
  const lt = t - 7 * BAR
  const k = smooth((lt - .4) / 3.2), made = MADE * k
  txt('MADE SO FAR', 540, 3250, 32, GOLD, smooth(lt / .6), { font: MONO, weight: 600, spacing: 10 })
  txt(money(made), 540, 3400, 170, WHITE, smooth((lt - .2) / .6), { weight: 700 })
  txt('of $1,000', 540, 3530, 56, SOFT, smooth((lt - .5) / .6), { italic: true })
  const bx = 110, bw = 860, by = 3640, bh = 54
  g.save(); g.globalAlpha = smooth((lt - .4) / .5); g.fillStyle = '#1c1912'; g.beginPath(); g.roundRect(bx, by, bw, bh, 27); g.fill(); g.strokeStyle = 'rgba(212,175,55,.5)'; g.lineWidth = 2; g.stroke()
  const fw = Math.max(bh, bw * (made / GOAL)); const fg = g.createLinearGradient(bx, 0, bx + fw, 0); fg.addColorStop(0, '#a8781f'); fg.addColorStop(1, GOLD2); g.fillStyle = fg; g.beginPath(); g.roundRect(bx, by, fw, bh, 27); g.fill(); g.restore()
  dot(bx + bw * (made / GOAL), by + bh / 2, 60, 'rgba(255,240,190,.7)', smooth((lt - .4) / .5))
  txt(`${(made / GOAL * 100).toFixed(1)}%`, bx + bw * (made / GOAL) + 70, by + bh / 2, 30, GOLD2, smooth((lt - .6) / .5), { font: MONO, weight: 600 })
  const rows = [['Your shares', SHARES.toFixed(2)], ['Worth today', money(VALUE)], ['You put in', money(PUT_IN)]]
  rows.forEach(([a, b], i) => { const y = 3830 + i * 74, al = smooth((lt - 3.4 - i * .3) / .5); txt(a, 160, y, 36, GREY, al, { font: SANS, align: 'left' }); txt(b, 920, y, 40, WHITE, al, { font: MONO, weight: 600, align: 'right' }); g.save(); g.globalAlpha = al * .3; g.strokeStyle = GOLD; g.beginPath(); g.moveTo(160, y + 36); g.lineTo(920, y + 36); g.stroke(); g.restore() })
}
function pace(t) { // 28.6 - 34.3 s: how long to go
  const lt = t - 10 * BAR
  txt('HOW LONG TO GO', 540, 4860, 32, GOLD, smooth(lt / .6), { font: MONO, weight: 600, spacing: 10 })
  txt('7 to 11 weeks', 540, 5020, 120, WHITE, smooth((lt - .3) / .6), { weight: 700 })
  txt(`at ${money(PACE_RECENT, 0)} to ${money(PACE_WEEK, 0)} a day, this week’s pace`, 540, 5150, 38, SOFT, smooth((lt - .9) / .6), { italic: true })
  txt('somewhere between late December and late January', 540, 5220, 32, GREY, smooth((lt - 1.5) / .6), { font: SANS })
  txt('Pace changes with the market. Past results don’t guarantee future returns.', 540, 5330, 24, GREY, smooth((lt - 2.2) / .6), { font: SANS })
}
function endCard(t) { // 34.3 - 37.5 s
  const lt = t - 12 * BAR
  txt('Next stop:', 540, 6020, 60, SOFT, smooth(lt / .5), { italic: true })
  txt('$1,000', 540, 6160, 190, GOLD2, smooth((lt - .3) / .6), { weight: 700 })
  fan(540, 6400, 110, GOLD, smooth((lt - .6) / .5), smooth((lt - .6) / 1.1))
  txt('MIDAS × KIYOSHI', 540, 6530, 56, WHITE, smooth((lt - 1) / .6), { weight: 700, spacing: 12 })
}
// camera stops (time, page y at the centre of the frame)
const STOPS = [[0, 640], [2 * BAR - .6, 700], [2 * BAR + .5, 2120], [7 * BAR - .5, 2140], [7 * BAR + .6, 3700], [10 * BAR - .5, 3720], [10 * BAR + .6, 5100], [12 * BAR - .5, 5110], [12 * BAR + .6, 6260], [DUR, 6270]]
function camY(t) { for (let i = 0; i < STOPS.length - 1; i++) { const [t0, y0] = STOPS[i], [t1, y1] = STOPS[i + 1]; if (t <= t1) return lerp(y0, y1, i % 2 ? smooth((t - t0) / (t1 - t0)) : (t - t0) / (t1 - t0)) } return STOPS[STOPS.length - 1][1] }
const rng = R(17), DUST = Array.from({ length: 140 }, () => [rng() * 1080, rng() * 6800, 1 + rng() * 2.4, rng()])
const grainC = document.createElement('canvas'); grainC.width = grainC.height = 256
{ const gx = grainC.getContext('2d'), id = gx.createImageData(256, 256), r2 = R(5); for (let i = 0; i < id.data.length; i += 4) { const v = r2() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 11 } gx.putImageData(id, 0, 0) }
function draw(t) {
  const n = 7, win = .25; let y = 0; for (let j = 0; j < n; j++) y += camY(clamp(t + (j / (n - 1) - .5) * 2 * win, 0, DUR)) / n
  g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = BG; g.fillRect(0, 0, W, H)
  const vg = g.createRadialGradient(W / 2, H * .45, 60, W / 2, H * .45, H * .7); vg.addColorStop(0, 'rgba(80,62,18,.32)'); vg.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = vg; g.fillRect(0, 0, W, H)
  g.save(); g.scale(W / 1080, H / 1920); g.translate(0, 960 - y)
  g.save(); g.fillStyle = GOLD2; for (const [x, yy, r, a] of DUST) { if (Math.abs(yy - y) > 1100) continue; g.globalAlpha = .12 * (.4 + .6 * Math.sin(t + a * 9) ** 2); g.beginPath(); g.arc(x, yy, r, 0, TAU); g.fill() } g.restore()
  for (const [fn, y0, t0] of [[title, 640, 0], [chart, 2120, 2 * BAR - 1], [goal, 3700, 7 * BAR - .6], [pace, 5100, 10 * BAR - .6], [endCard, 6260, 12 * BAR - .6]]) if (Math.abs(y0 - y) < 1500 && t > t0) fn(t)
  g.restore()
  const gp = g.createPattern(grainC, 'repeat'); g.save(); g.translate((t * 997) % 256, (t * 613) % 256); g.fillStyle = gp; g.fillRect(-256, -256, W + 512, H + 512); g.restore()
  g.globalAlpha = clamp(1 - t / .6) + clamp((t - (DUR - 1)) / 1); g.fillStyle = '#000'; g.fillRect(0, 0, W, H); g.globalAlpha = 1
}
window.draw = draw; window.DUR = DUR; window.READY = Promise.resolve()
</script>
</body></html>
