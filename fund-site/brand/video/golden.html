<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#05070f}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script>
// "Golden Hour": Lagos at sunset, Kiyoshi's fan as the sun; night falls and every city light that blinks on is a
// trade; dawn, a little higher than before. 44 s, a slow continuous pan, timed to score-golden.py (92 BPM: a bar
// is 2.61 s). draw(t) is deterministic.
const P = new URLSearchParams(location.search)
const W = +(P.get('w') || 1920), H = +(P.get('h') || 1080)
const c = document.getElementById('c'); c.width = W; c.height = H
const g = c.getContext('2d')
const DUR = 44, BAR = 4 * 60 / 92
const GOLD = '#D4AF37', GOLD2 = '#F3D77A', WHITE = '#F4F4F0', SOFT = '#e9dcc4'
const SERIF = 'Caladea, "Liberation Serif", serif', MONO = '"JetBrains Mono", monospace'
const TAU = Math.PI * 2
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const lerp = (a, b, k) => a + (b - a) * k
const smooth = (x) => { x = clamp(x); return x * x * x * (x * (x * 6 - 15) + 10) }
const inout = (t, a, b, f = .7) => smooth((t - a) / f) * (1 - smooth((t - b) / f))
const hash = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x) }
const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]
const mixc = (a, b, k) => { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], k))).join(',')})` }
function txt(s, x, y, size, color, alpha = 1, o = {}) { if (alpha <= .003) return; g.save(); g.globalAlpha *= alpha; g.fillStyle = color; g.font = `${o.italic ? 'italic ' : ''}${o.weight || 400} ${size}px ${o.font || SERIF}`; g.textAlign = o.align || 'center'; g.textBaseline = 'middle'; if (o.spacing) g.letterSpacing = o.spacing + 'px'; g.shadowColor = 'rgba(0,0,0,.5)'; g.shadowBlur = 18; g.fillText(s, x, y); g.restore() }
function dot(x, y, r, color, a = 1) { if (a <= 0) return; const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, color); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.save(); g.globalAlpha *= a; g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill(); g.restore() }
const NB = 13, A0 = Math.PI * 1.07, A1 = Math.PI * 1.93
function fan(cx, cy, r, color, a = 1) { if (a <= 0) return; g.save(); g.globalAlpha *= a; g.fillStyle = color; const w = (A1 - A0) / NB
  for (let i = 0; i < NB; i++) { const s = A0 + i * w + .012, e = A0 + (i + 1) * w - .012; g.beginPath(); g.moveTo(cx + Math.cos(s) * r * .06, cy + Math.sin(s) * r * .06); g.lineTo(cx + Math.cos(s) * r, cy + Math.sin(s) * r); g.lineTo(cx + Math.cos(e) * r, cy + Math.sin(e) * r); g.lineTo(cx + Math.cos(e) * r * .06, cy + Math.sin(e) * r * .06); g.fill() }
  g.strokeStyle = color; g.lineWidth = r * .05; g.beginPath(); g.arc(cx, cy + r * .05, r * .06, 0, TAU); g.stroke(); g.restore() }

// ---------- the day: sky colours and the sun's height over time ----------
const SKY = [ // [time, top, middle, horizon]
  [0, '#2b2350', '#c0553a', '#f3b05a'], [6, '#1c1d44', '#7a3446', '#d46a3c'], [10, '#0b0f26', '#2a1d3c', '#6a3040'],
  [13, '#05070f', '#0b1026', '#1f2340'], [30, '#05070f', '#0b1026', '#1f2340'], [35, '#1a2550', '#6a4a70', '#d07a5a'],
  [39, '#3a4f86', '#e09a72', '#f9d690'], [44, '#4a64a0', '#efb282', '#fbe2a6']]
function sky(t) { let i = 0; while (i < SKY.length - 2 && t > SKY[i + 1][0]) i++; const [t0, ...a] = SKY[i], [t1, ...b] = SKY[i + 1], k = smooth((t - t0) / (t1 - t0)); return a.map((col, j) => mixc(col, b[j], k)) }
const sunY = (t) => t < 12 ? lerp(400, 860, smooth((t - 1) / 10)) : t < 31 ? 900 : lerp(900, 380, smooth((t - 31) / 9)) // sets, then rises higher
const nightK = (t) => smooth((t - 8.5) / 3) * (1 - smooth((t - 31) / 4))
const HORIZON = 720

// ---------- the city: three layers of buildings with windows ----------
const LAYERS = [0, 1, 2].map((L) => { const out = []; let x = -400; let i = 0
  while (x < 3600) { const w = 50 + hash(L * 1000 + i) * (L === 2 ? 120 : 90), h = (L === 2 ? 70 : L === 1 ? 60 : 40) + hash(L * 2000 + i) * (L === 2 ? 190 : L === 1 ? 170 : 110) + (hash(L * 3000 + i) > .93 ? 110 : 0)
    out.push({ x, w, h, seed: L * 5000 + i }); x += w + 4 + hash(L * 4000 + i) * 18; i++ } return out })
const LCOL = ['#3a2c3a', '#2a2030', '#17121c'], PAR = [.25, .5, 1]
function city(t, cam, reflect) {
  const night = nightK(t)
  LAYERS.forEach((bs, L) => {
    const off = -cam * PAR[L]
    for (const b of bs) {
      const x = b.x + off; if (x > 1960 || x + b.w < -40) continue
      g.fillStyle = mixc(LCOL[L], L === 2 ? '#070910' : '#0d1020', night); g.fillRect(x, HORIZON - b.h, b.w, b.h)
      if (L === 0) continue
      // windows: they come on through the night; a few flash gold as trades
      const cols = Math.floor(b.w / 16), rows = Math.floor(b.h / 22)
      for (let r = 0; r < rows; r++) for (let q = 0; q < cols; q++) {
        const s = hash(b.seed * 97 + r * 13 + q), on = 9 + s * 20
        if (t < on || t > 33 + s * 5 || s < .35) continue
        const flash = Math.max(0, Math.sin((t - on) * (1 + s) * 2) - .96) * 25, a = clamp((t - on) / .6) * (.35 + .4 * s) * night
        g.fillStyle = flash > 0 ? `rgba(243,215,122,${Math.min(1, a + flash)})` : `rgba(255,200,120,${a})`
        g.fillRect(x + 5 + q * 16, HORIZON - b.h + 8 + r * 22, 8, 11)
      }
    }
  })
}
// floating trade labels rising from the city at night
const TRADES = Array.from({ length: 34 }, (_, i) => ({ t: 12 + i * .55 + hash(i) * .4, x: 120 + hash(i + 50) * 1680, v: (.02 + hash(i + 90) * .4).toFixed(2) }))
function trades(t) { for (const tr of TRADES) { const q = (t - tr.t) / 2.2; if (q < 0 || q > 1) continue; const y = HORIZON - 120 - q * 260, a = Math.sin(q * Math.PI)
  dot(tr.x, y + 10, 26, 'rgba(243,215,122,.6)', a * .6); txt(`+$${tr.v}`, tr.x, y, 26, GOLD2, a, { font: MONO, weight: 600 }) } }

function scene(t) {
  const cam = t * 26 // the slow pan
  const [top, mid, hor] = sky(t)
  const sg = g.createLinearGradient(0, 0, 0, HORIZON); sg.addColorStop(0, top); sg.addColorStop(.6, mid); sg.addColorStop(1, hor); g.fillStyle = sg; g.fillRect(0, 0, 1920, HORIZON)
  // stars
  const night = nightK(t); for (let i = 0; i < 160; i++) { const x = (hash(i) * 2400 - cam * .05) % 1920, y = hash(i + 300) * 560, tw = .4 + .6 * Math.sin(t * (1 + hash(i + 9)) + i) ** 2; g.fillStyle = `rgba(255,250,235,${.6 * tw * night})`; g.fillRect((x + 1920) % 1920, y, 2, 2) }
  // the sun: Kiyoshi's fan, with its glow
  const sy = sunY(t), sx = 980, warm = 1 - night * .9
  dot(sx, sy, 520, `rgba(255,190,90,${.45 * warm})`); dot(sx, sy, 240, `rgba(255,230,160,${.6 * warm})`)
  fan(sx, sy + 70, 230, GOLD2, .95 * warm + .05)
  city(t, cam)
  // water, with the city and the sun reflected and rippling
  const wg = g.createLinearGradient(0, HORIZON, 0, 1080); wg.addColorStop(0, mixc('#7a4a3a', '#0b0f22', night)); wg.addColorStop(1, mixc('#2a1a24', '#03040a', night)); g.fillStyle = wg; g.fillRect(0, HORIZON, 1920, 360)
  for (let y = HORIZON; y < 1080; y += 4) { const d = y - HORIZON, sh = Math.sin(y * .09 + t * 2.4) * (2 + d * .03), srcY = HORIZON - d * 1.1
    if (srcY < 0) break; g.globalAlpha = .22 * (1 - d / 360); g.drawImage(c, 0, srcY * H / 1080, W, 4 * H / 1080, sh * W / 1920, y * H / 1080 / (H / 1080), 1920, 4) }
  g.globalAlpha = 1
  dot(sx, HORIZON + (HORIZON - sy) * .5 + 30, 200, `rgba(255,200,110,${.25 * warm})`)
  trades(t)
  // words
  txt('Golden hour in Lagos.', 960, 110, 64, WHITE, inout(t, 1, 5.2), { weight: 700 })
  txt('The markets close their eyes.', 960, 110, 64, WHITE, inout(t, 5.8, 10.2), { weight: 700 })
  txt('Kiyoshi doesn’t.', 960, 110, 72, GOLD2, inout(t, 11, 15.6), { weight: 700 })
  txt('Every light, a trade.', 960, 110, 64, WHITE, inout(t, 16.2, 20.8), { weight: 700 })
  txt('Lagos · Buenos Aires · São Paulo', 960, 110, 56, WHITE, inout(t, 21.4, 25.8), { weight: 700 })
  txt('All night long.', 960, 110, 64, WHITE, inout(t, 26.4, 30.8), { weight: 700, italic: true })
  txt('Every morning, a little more.', 960, 110, 66, WHITE, inout(t, 31.8, 38.4), { weight: 700 })
  txt('MIDAS × KIYOSHI', 960, 90, 80, WHITE, smooth((t - 39.2) / .8), { weight: 700, spacing: 18 })
  txt('Celo FX arbitrage, around the clock', 960, 150, 34, SOFT, smooth((t - 40) / .8), { italic: true })
}
function draw(t) {
  g.setTransform(W / 1920, 0, 0, H / 1080, 0, 0)
  scene(t)
  g.setTransform(1, 0, 0, 1, 0, 0)
  const vg = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .4, W / 2, H / 2, Math.max(W, H) * .75); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.5)'); g.fillStyle = vg; g.fillRect(0, 0, W, H)
  g.globalAlpha = clamp(1 - t / .6) + clamp((t - (DUR - 1)) / 1); g.fillStyle = '#000'; g.fillRect(0, 0, W, H); g.globalAlpha = 1
}
window.draw = draw; window.DUR = DUR; window.READY = Promise.resolve()
</script>
</body></html>
