<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#0b0907}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script>
// "Small Wins": every trade is a coin dropped in a jar. A few cents each, a losing one taken back out (it counts
// too), then a whole real day pours in: 5 Nov 2026, 260 trades, +$25.83 before gas (Telegram /today). Then the jars
// of the week, filled to the on-chain share price. 40 s, timed to score-smallwins.py (100 BPM: a bar is 2.4 s).
const P = new URLSearchParams(location.search)
const W = +(P.get('w') || 1920), H = +(P.get('h') || 1080)
const c = document.getElementById('c'); c.width = W; c.height = H
const g = c.getContext('2d')
const DUR = 40
const GOLD = '#D4AF37', GOLD2 = '#F3D77A', DEEP = '#8a6a1c', WHITE = '#F4F1EA', SOFT = '#cfc6b4', GREY = '#8c857a', RED = '#c46a5a'
const SERIF = 'Caladea, "Liberation Serif", serif', MONO = '"JetBrains Mono", monospace', SANS = 'Inter, sans-serif'
const TAU = Math.PI * 2
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const lerp = (a, b, k) => a + (b - a) * k
const smooth = (x) => { x = clamp(x); return x * x * x * (x * (x * 6 - 15) + 10) }
const inout = (t, a, b, f = .6) => smooth((t - a) / f) * (1 - smooth((t - b) / f))
const hash = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x) }
function txt(s, x, y, size, color, alpha = 1, o = {}) { if (alpha <= .003) return; g.save(); g.globalAlpha *= alpha; g.fillStyle = color; g.font = `${o.italic ? 'italic ' : ''}${o.weight || 400} ${size}px ${o.font || SERIF}`; g.textAlign = o.align || 'center'; g.textBaseline = 'middle'; if (o.spacing) g.letterSpacing = o.spacing + 'px'; g.fillText(s, x, y); g.restore() }
function dot(x, y, r, color, a = 1) { if (a <= 0) return; const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, color); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.save(); g.globalAlpha *= a; g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill(); g.restore() }
const NB = 13, A0 = Math.PI * 1.07, A1 = Math.PI * 1.93
function fan(cx, cy, r, color, a = 1, open = 1) { if (a <= 0) return; g.save(); g.globalAlpha *= a; g.fillStyle = color; const w = (A1 - A0) / NB
  for (let i = 0; i < NB; i++) { const s = A0 + i * w * open + .012, e = A0 + (i + 1) * w * open - .012; g.beginPath(); g.moveTo(cx + Math.cos(s) * r * .06, cy + Math.sin(s) * r * .06); g.lineTo(cx + Math.cos(s) * r, cy + Math.sin(s) * r); g.lineTo(cx + Math.cos(e) * r, cy + Math.sin(e) * r); g.lineTo(cx + Math.cos(e) * r * .06, cy + Math.sin(e) * r * .06); g.fill() }
  g.strokeStyle = color; g.lineWidth = r * .05; g.beginPath(); g.arc(cx, cy + r * .05, r * .06, 0, TAU); g.stroke(); g.restore() }

// ---------- the drops (the score uses the same times for its coin tinks) ----------
const SLOW = [5.0, 6.2, 7.4, 8.6, 9.8, 11.0, 12.2, 13.4] // the first eight, one by one (half a bar apart)
const LOSS_AT = 15.0                                  // a ninth coin, a loser, lands, then is lifted out
const N = 259 // + the losing coin = 260 trades
const DROPS = []
for (let i = 0; i < N; i++) {
  if (i < 8) DROPS.push(SLOW[i])
  else { const q = (i - 8) / (N - 9); DROPS.push(19.2 + 10.4 * Math.pow(q, .62)) } // pours faster, then eases
}
// what each coin was worth: mostly a few cents, a few bigger (they sum to the real day: +$25.83 after the loss)
const VAL = DROPS.map((_, i) => .02 + Math.pow(hash(i + 7), 3) * .35)
const LOSS = -0.31
const scaleV = (25.83 - LOSS) / VAL.reduce((a, b) => a + b, 0); for (let i = 0; i < N; i++) VAL[i] *= scaleV
const SHOW = [0.12, 0.04, 0.09, 0.21, 0.03, 0.07, 0.15, 0.05] // the labels on the first eight

// ---------- the jar ----------
const JX = 700, JB = 900, JW = 400, JH = 520 // centre x, bottom y, inner width, height
const PER = 8, CW = 46, CH = 13
function slot(i) { const r = Math.floor(i / PER), k = i % PER, off = r % 2 ? CW / 2 : 0
  const x = JX - JW / 2 + 30 + k * ((JW - 60 - CW / 2) / (PER - 1)) + off * .5 + (hash(i * 3) - .5) * 10
  return [x, JB - 16 - r * 8.2 - hash(i * 5) * 3, (hash(i * 11) - .5) * .5] }
function coin(x, y, rot, a = 1, red = false, s = 1) { if (a <= 0) return; g.save(); g.globalAlpha *= a; g.translate(x, y); g.rotate(rot); g.scale(s, s)
  g.fillStyle = red ? '#6b3a30' : DEEP; g.beginPath(); g.ellipse(0, 3, CW / 2, CH / 2, 0, 0, TAU); g.fill()
  const gr = g.createLinearGradient(-CW / 2, -CH / 2, CW / 2, CH / 2); gr.addColorStop(0, red ? '#e0907e' : GOLD2); gr.addColorStop(.5, red ? RED : GOLD); gr.addColorStop(1, red ? '#7a3f34' : DEEP)
  g.fillStyle = gr; g.beginPath(); g.ellipse(0, 0, CW / 2, CH / 2, 0, 0, TAU); g.fill()
  g.strokeStyle = 'rgba(255,240,200,.45)'; g.lineWidth = 1.2; g.beginPath(); g.ellipse(0, 0, CW / 2 - 6, CH / 2 - 2, 0, 0, TAU); g.stroke(); g.restore() }
function fall(t, t0, y1) { const q = (t - t0) / .55; if (q < 0) return null; if (q >= 1) { const b = (t - t0 - .55); return y1 - Math.max(0, Math.sin(b * 18) * 8 * Math.exp(-b * 9)) } return lerp(80, y1, q * q) }
function jarGlass(x, b, w, h, a = 1, s = 1) { g.save(); g.globalAlpha *= a; g.translate(x, b); g.scale(s, s)
  g.fillStyle = 'rgba(255,245,220,.035)'; g.strokeStyle = 'rgba(243,215,122,.55)'; g.lineWidth = 3
  g.beginPath(); g.moveTo(-w / 2 + 20, -h); g.lineTo(-w / 2 + 20, -h + 30); g.quadraticCurveTo(-w / 2 - 14, -h + 60, -w / 2 - 14, -h + 120); g.lineTo(-w / 2 - 14, -24); g.quadraticCurveTo(-w / 2 - 14, 8, -w / 2 + 20, 8)
  g.lineTo(w / 2 - 20, 8); g.quadraticCurveTo(w / 2 + 14, 8, w / 2 + 14, -24); g.lineTo(w / 2 + 14, -h + 120); g.quadraticCurveTo(w / 2 + 14, -h + 60, w / 2 - 20, -h + 30); g.lineTo(w / 2 - 20, -h); g.fill(); g.stroke()
  g.strokeStyle = 'rgba(255,250,235,.18)'; g.lineWidth = 10; g.beginPath(); g.moveTo(-w / 2 + 6, -h + 150); g.lineTo(-w / 2 + 6, -60); g.stroke()
  g.fillStyle = 'rgba(212,175,55,.25)'; g.fillRect(-w / 2 + 14, -h - 14, w - 28, 14); g.restore() }

function bigJar(t, k, fade = 1) { // k: 1 = full size in place, 0 = stepped aside
  if (fade <= 0) return
  const sc = lerp(.46, 1, k), dx = lerp(-380, 0, k), dy = lerp(-40, 0, k)
  g.save(); g.globalAlpha = fade; g.translate(JX + dx, JB + dy); g.scale(sc, sc); g.translate(-JX, -JB)
  jarGlass(JX, JB, JW, JH)
  for (let i = 0; i < N; i++) { const [x, y1, rot] = slot(i); const y = fall(t, DROPS[i], y1); if (y == null) continue; coin(x, y, rot) }
  // the losing coin: lands on top, glows red, then lifts back out
  const lt = t - LOSS_AT
  if (lt > 0 && lt < 4.4) { const [x, y1] = slot(8 + 2); const yl = lt < .55 ? lerp(80, y1 - 26, (lt / .55) ** 2) : lt < 2.2 ? y1 - 26 : lerp(y1 - 26, -60, smooth((lt - 2.2) / 1.8))
    coin(x + 40, yl, .2, 1 - smooth((lt - 3.6) / .6), true, 1.5); txt(`-$${Math.abs(LOSS).toFixed(2)}`, x + 40, yl - 34, 30, '#e7a090', inout(t, LOSS_AT + .5, LOSS_AT + 3.6, .3), { font: MONO, weight: 600 }) }
  // labels above the first eight
  for (let i = 0; i < 8; i++) { const q = (t - DROPS[i] - .55) / 1.3; if (q < 0 || q > 1) continue; const [x, y1] = slot(i)
    txt(`+$${SHOW[i].toFixed(2)}`, x, y1 - 40 - q * 50, 30, GOLD2, Math.sin(q * Math.PI), { font: MONO, weight: 600 }) }
  g.restore()
}

// ---------- the week's jars: filled to the share price (on-chain, end of each day) ----------
const WEEK = [['29 Oct', 1.0020], ['30 Oct', 1.2120], ['31 Oct', 1.2460], ['1 Nov', 1.2996], ['2 Nov', 1.4235], ['3 Nov', 1.4606], ['4 Nov', 1.5072], ['5 Nov', 1.5642]]
function week(t) {
  const a = clamp((t - 30.4) / .6) * (1 - smooth((t - 36.2) / .6)); if (a <= 0) return
  WEEK.forEach(([d, p], i) => { const x = 900 + i * 128, k = smooth((t - 30.6 - i * .32) / .7) * a, b = 860, h = 150 + (p - 1) * 520
    jarGlass(x, b, 96, h * k + 40, k, 1)
    const fill = clamp((t - 30.9 - i * .32) / .9)
    g.save(); g.globalAlpha = k; const gr = g.createLinearGradient(0, b - h, 0, b); gr.addColorStop(0, GOLD2); gr.addColorStop(1, DEEP); g.fillStyle = gr
    g.beginPath(); g.roundRect(x - 48 + 6, b - h * fill + 2, 84, h * fill, 8); g.fill(); g.restore()
    txt(`$${p.toFixed(2)}`, x, b - h * fill - 34, 26, i === 7 ? GOLD2 : WHITE, k * clamp(fill * 3 - .5), { font: MONO, weight: 600 })
    txt(d, x, b + 40, 22, GREY, k, { font: SANS }) })
  txt('The share price, end of each day', 1348, 260, 40, WHITE, inout(t, 31, 36.2), { weight: 700 })
  txt('on-chain · +56% in a week', 1348, 312, 28, SOFT, inout(t, 31.4, 36.2), { italic: true })
}

// ---------- the counter on the right ----------
function counter(t) {
  let n = 0, pnl = 0
  for (let i = 0; i < N; i++) if (t >= DROPS[i] + .55) { n++; pnl += VAL[i] }
  if (t >= LOSS_AT + .55) { n++; pnl += LOSS }
  const a = inout(t, 19.4, 30.2)
  txt('5 NOVEMBER · ONE REAL DAY', 1380, 330, 28, GOLD, a, { font: MONO, weight: 600, spacing: 8 })
  txt(String(n), 1380, 450, 150, WHITE, a, { font: MONO, weight: 600 })
  txt('trades', 1380, 545, 34, SOFT, a, { italic: true })
  txt(`${pnl >= 0 ? '+' : '-'}$${Math.abs(pnl).toFixed(2)}`, 1380, 660, 96, GOLD2, a, { font: MONO, weight: 600 })
  txt('profit before gas', 1380, 735, 30, SOFT, a, { italic: true })
  txt('208 of them profitable · from Telegram /today', 1380, 800, 24, GREY, a * smooth((t - 28.6) / .8), { font: SANS })
}

function words(t) {
  txt('Every trade is small.', 1380, 470, 72, WHITE, inout(t, 1.2, 8.4), { weight: 700 })
  txt('A few cents at a time.', 1380, 560, 44, SOFT, inout(t, 5.8, 8.4), { italic: true })
  txt('Thousands of times a week.', 1380, 470, 64, WHITE, inout(t, 9.2, 14.2), { weight: 700 })
  txt('Some lose.', 1380, 450, 72, '#e7a090', inout(t, LOSS_AT + .4, LOSS_AT + 3.9), { weight: 700 })
  txt('We count those too.', 1380, 540, 54, WHITE, inout(t, LOSS_AT + 1.2, LOSS_AT + 3.9), { italic: true })
}
function endCard(t) {
  const lt = t - 36.8; if (lt < 0) return
  fan(960, 420, 150, GOLD, smooth(lt / .6), smooth(lt / 1.2))
  txt('MIDAS × KIYOSHI', 960, 590, 80, WHITE, smooth((lt - .4) / .6), { weight: 700, spacing: 18 })
  txt('small wins, all day', 960, 665, 40, SOFT, smooth((lt - .9) / .6), { italic: true })
}
function draw(t) {
  g.setTransform(W / 1920, 0, 0, H / 1080, 0, 0)
  g.fillStyle = '#0b0907'; g.fillRect(0, 0, 1920, 1080)
  dot(JX, 640, 760, 'rgba(120,88,30,.28)'); dot(1380, 520, 600, 'rgba(90,66,24,.18)')
  g.fillStyle = '#16110b'; g.fillRect(0, 912, 1920, 168) // the table the jar sits on
  g.fillStyle = 'rgba(243,215,122,.12)'; g.fillRect(0, 912, 1920, 2)
  const k = 1 - smooth((t - 30) / 1.4) // jar steps aside for the week
  bigJar(t, k, 1 - smooth((t - 36) / .8))
  words(t); counter(t); week(t); endCard(t)
  g.setTransform(1, 0, 0, 1, 0, 0)
  const vg = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .35, W / 2, H / 2, Math.max(W, H) * .75); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.55)'); g.fillStyle = vg; g.fillRect(0, 0, W, H)
  g.globalAlpha = clamp(1 - t / .6) + clamp((t - (DUR - 1)) / 1); g.fillStyle = '#000'; g.fillRect(0, 0, W, H); g.globalAlpha = 1
}
window.draw = draw; window.DUR = DUR; window.READY = Promise.resolve()
window.DROPS = DROPS
</script>
</body></html>
