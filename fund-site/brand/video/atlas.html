<script>
// "The Atlas": an antique map of the Atlantic, drawn in ink on parchment. Money crossed it by ship in weeks, then by
// wire in days; Kiyoshi crosses it every thirty seconds (Lagos · Buenos Aires · São Paulo). A cartographer's ledger
// with the real numbers, then a wax seal. 48 s, timed to score-atlas.py (a waltz: 3/4 at 84 BPM, a bar is 2.143 s).
const P = new URLSearchParams(location.search)
const W = +(P.get('w') || 1920), H = +(P.get('h') || 1080)
const c = document.getElementById('c'); c.width = W; c.height = H
const g = c.getContext('2d')
const DUR = 48, BAR = 3 * 60 / 84
const INK = '#3a2814', INK2 = '#5a4126', PAPER = '#e9d8ae', GOLD = '#c8962c', GOLD2 = '#f0c75e', WAX = '#9c1e28'
const SERIF = 'Caladea, "Liberation Serif", serif', SANS = 'Inter, sans-serif'
const TAU = Math.PI * 2
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const lerp = (a, b, k) => a + (b - a) * k
const smooth = (x) => { x = clamp(x); return x * x * x * (x * (x * 6 - 15) + 10) }
const inout = (t, a, b, f = .7) => smooth((t - a) / f) * (1 - smooth((t - b) / f))
const R = (s) => () => { s |= 0; s = (s + 0x6d2b79f5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296 }
const B = (n) => n * BAR // bar n, in seconds

// ---------- the world: equirectangular, 14 px a degree ----------
const K = 14, S = 2, WW = 195 * K, WH = 128 * K
const wx = (lon) => (lon + 125) * K, wy = (lat) => (62 - lat) * K

const SOUTH_AMERICA = [[-77.5, 8.5], [-75, 11], [-71.5, 12.4], [-67, 10.7], [-62, 10.6], [-60, 8.5], [-57, 6], [-52, 4.8], [-50, 1.8], [-48.5, -1], [-44.5, -2.5], [-40, -2.8], [-35.2, -5.5], [-34.8, -8], [-37, -11], [-39, -15], [-39.5, -18.5], [-41, -22], [-44, -23], [-48.5, -26], [-48.6, -28.5], [-51, -31], [-53, -33.7], [-55, -35], [-57.5, -36], [-57, -38.5], [-62, -39], [-65, -41], [-65, -45], [-67.5, -46.5], [-66, -48], [-68.5, -50.5], [-69, -52.5], [-71, -54], [-74.5, -52], [-75.5, -48], [-74, -44], [-73.5, -40], [-73.5, -37], [-71.5, -32], [-71.5, -28], [-70.5, -23], [-70.3, -18.5], [-75, -15.5], [-77, -12], [-79.5, -7.5], [-81.2, -5], [-80, -1], [-80, 1], [-78.8, 2], [-77.5, 4], [-77.3, 7]]
const EUROPE = [[-9.5, 37], [-6.3, 36.8], [-5.6, 36], [-2, 36.7], [0.5, 38.8], [-0.3, 39.5], [3.2, 41.9], [3.1, 43.1], [4.8, 43.4], [7.5, 43.8], [9, 44.4], [10.5, 42.9], [12.5, 41.4], [15.6, 38], [16.5, 39.5], [18.5, 40.2], [15.5, 42], [13.5, 45.6], [28, 41], [29, 64], [-2, 64], [-1.2, 48.5], [-4.7, 48.4], [-1.2, 46], [-1.5, 43.4], [-8.8, 43.6], [-9.3, 42.9], [-8.8, 40.5], [-9.5, 38.7]]
const NORTH_AMERICA = [[-140, 64], [-56, 64], [-56, 52], [-60, 47], [-61, 45.5], [-64, 45.5], [-66.8, 44.8], [-70, 44], [-70, 41.6], [-74, 40.6], [-75.5, 38], [-76.5, 35], [-81.4, 31], [-80.1, 26.5], [-81, 25.2], [-82.8, 27.9], [-84.4, 30], [-89, 30.3], [-94, 29.6], [-97.3, 27.6], [-97.7, 24], [-97.2, 21], [-96, 19], [-94.5, 18.2], [-91, 18.8], [-90.5, 21], [-87, 21.5], [-87.5, 18.5], [-88.2, 16], [-84, 15.8], [-83.2, 12], [-83.6, 10.8], [-81.5, 9], [-79.5, 9.5], [-77.5, 8.5], [-77.3, 7], [-79.9, 7.3], [-80.5, 8.2], [-83, 8.3], [-85.7, 10], [-87.5, 13], [-91.5, 14], [-94.5, 16.2], [-97, 15.8], [-101, 17.5], [-105.5, 20], [-106, 23], [-109, 25.5], [-112.5, 29], [-114.5, 31.5], [-117, 32.5], [-120, 34.5], [-124, 40], [-124.5, 48], [-131, 54], [-140, 59]]
const ARABIA = [[32, 31.3], [35.5, 33.5], [36, 36.8], [28, 41], [29, 64], [75, 64], [75, 25], [66.5, 25.3], [61.5, 25.2], [57.3, 25.8], [56.3, 26.4], [56, 26.2], [57, 23.5], [59.8, 22.5], [57, 18.8], [52, 16.5], [45, 13], [43.3, 12.8], [42.6, 15.5], [39, 21], [35, 28], [34.5, 28]]
const CUBA = [[-85, 21.8], [-82, 23.1], [-77, 22.2], [-74.2, 20.2], [-77.7, 19.9], [-80.5, 22], [-84.9, 21.4]]
const HISPANIOLA = [[-74.4, 19.8], [-71.8, 19.9], [-68.4, 18.6], [-70, 18.2], [-71.5, 17.6], [-74.4, 18.4]]
const MADAGASCAR = [[44.3, -25], [43.5, -22], [44.4, -16], [47, -15], [49.3, -12], [50.4, -15.5], [47.1, -25], [45, -25.6]]
const LANDS = [ARABIA, AFRICA, SOUTH_AMERICA, EUROPE, NORTH_AMERICA, CUBA, HISPANIOLA, MADAGASCAR]
// a hand-drawn coast: subdivide and wobble each edge (deterministic)
function coast(pts, seed) {
  const out = []
  for (let i = 0; i < pts.length; i++) {
    const [ax, ay] = pts[i], [bx, by] = pts[(i + 1) % pts.length], d = Math.hypot(bx - ax, by - ay), n = Math.max(1, Math.ceil(d / .45))
    const nx = -(by - ay) / (d || 1), ny = (bx - ax) / (d || 1)
    for (let j = 0; j < n; j++) { const k = j / n, x = lerp(ax, bx, k), y = lerp(ay, by, k)
      const a = .32 * (Math.sin(x * 1.7 + seed) * .55 + Math.sin(y * 2.9 + seed * 2) * .3 + Math.sin((x + y) * 6.1 + seed) * .15)
      out.push([wx(x + nx * a), wy(y + ny * a)]) }

  return out

const COASTS = LANDS.map((p, i) => coast(p, i * 1.7 + .3))
const path = (x, pts) => { x.beginPath(); pts.forEach(([X, Y], i) => (i ? x.lineTo(X, Y) : x.moveTo(X, Y))); x.closePath() }

let MAP = null

  const m = M.getContext('2d'); m.scale(S, S)
  const r = R(11)
  m.fillStyle = PAPER; m.fillRect(0, 0, WW, WH)
  for (let i = 0; i < 26; i++) { const x = r() * WW, y = r() * WH, rad = 80 + r() * 420, gr = m.createRadialGradient(x, y, 0, x, y, rad)
    gr.addColorStop(0, `rgba(150,105,50,${.04 + r() * .07})`); gr.addColorStop(1, 'rgba(150,105,50,0)'); m.fillStyle = gr; m.fillRect(x - rad, y - rad, rad * 2, rad * 2) }
  // graticule
  m.strokeStyle = 'rgba(74,52,32,.2)'; m.lineWidth = 1
  for (let lon = -120; lon <= 75; lon += 15) { m.beginPath(); m.moveTo(wx(lon), 0); m.lineTo(wx(lon), WH); m.stroke() }
  for (let lat = -60; lat <= 60; lat += 15) { m.beginPath(); m.moveTo(0, wy(lat)); m.lineTo(WW, wy(lat)); m.stroke() }
  m.setLineDash([10, 8]); m.strokeStyle = 'rgba(74,52,32,.45)'; m.lineWidth = 1.4
  for (const lat of [0, -23.44, 23.44]) { m.beginPath(); m.moveTo(0, wy(lat)); m.lineTo(WW, wy(lat)); m.stroke() }
  m.setLineDash([])
  const lab = (s, x, y, size, o = {}) => { m.save(); m.fillStyle = o.color || 'rgba(58,40,20,.75)'; m.font = `${o.italic ? 'italic ' : ''}${o.weight || 400} ${size}px ${SERIF}`; m.textAlign = o.align || 'center'; m.textBaseline = 'middle'; m.letterSpacing = (o.spacing || 0) + 'px'; m.translate(x, y); if (o.rot) m.rotate(o.rot); m.fillText(s, 0, 0); m.restore() }
  lab('EQUATOR', wx(-24), wy(0) - 12, 15, { spacing: 8, italic: true })
  lab('TROPIC OF CAPRICORN', wx(-30), wy(-23.44) - 12, 15, { spacing: 8, italic: true })
  lab('TROPIC OF CANCER', wx(-40), wy(23.44) - 12, 15, { spacing: 8, italic: true })
  // coasts: ink halos on the sea, the land, then the coastline
  for (const [w, a] of [[46, .035], [32, .05], [20, .07], [10, .1]]) { m.strokeStyle = `rgba(80,55,28,${a})`; m.lineWidth = w; m.lineJoin = 'round'; for (const p of COASTS) { path(m, p); m.stroke() } }
  for (const p of COASTS) { path(m, p); const gr = m.createLinearGradient(0, 0, WW, WH); gr.addColorStop(0, '#dcc392'); gr.addColorStop(1, '#d6bb86'); m.fillStyle = gr; m.fill()
    m.save(); m.clip(); m.strokeStyle = 'rgba(110,75,35,.12)'; m.lineWidth = 22; m.stroke(); m.restore() }
  m.strokeStyle = INK; m.lineWidth = 2.2; for (const p of COASTS) { path(m, p); m.stroke() }
  // engraved hatching on the land
  m.save(); for (const p of COASTS) { path(m, p) } m.clip(); m.strokeStyle = 'rgba(90,62,30,.08)'; m.lineWidth = 1
  for (let k = -WH; k < WW; k += 9) { m.beginPath(); m.moveTo(k, 0); m.lineTo(k + WH, WH); m.stroke() } m.restore()

  lab('AFRICA', wx(20), wy(8), 54, { spacing: 26 })
  lab('SOUTH AMERICA', wx(-60), wy(-12), 46, { spacing: 18 })
  lab('EUROPE', wx(4), wy(50), 38, { spacing: 20 })
  lab('NORTH AMERICA', wx(-100), wy(44), 40, { spacing: 18 })
  lab('THE ATLANTIC OCEAN', wx(-30), wy(12), 34, { spacing: 22, italic: true, color: 'rgba(58,40,20,.6)', rot: -.08 })
  lab('the South Atlantic', wx(-6), wy(-27), 26, { spacing: 10, italic: true, color: 'rgba(58,40,20,.5)' })
  lab('Gulf of Guinea', wx(2), wy(1.2), 18, { italic: true, color: 'rgba(58,40,20,.55)' })

  const sx = wx(-100), sy = wy(-50)
  for (let i = 0; i < 6; i++) { m.fillStyle = i % 2 ? PAPER : INK; m.fillRect(sx + i * 40, sy, 40, 9); m.strokeStyle = INK; m.lineWidth = 1.2; m.strokeRect(sx + i * 40, sy, 40, 9) }

}

// ---------- the camera: a smooth spline through keyframes [t, lon, lat, zoom] ----------
const KF = [[0, -28, -9, .78], [5.2, -24, -6, .86], [B(3), 2.6, 5, 2.05], [B(6) - .2, 1.2, 4, 2.2],
  [B(9) + .4, -54, -31, 1.8], [B(10), -47.5, -24.5, 1.95], [B(12.6), -45, -25, 2.1], [B(13) + 1.2, -26, -13, .92],
  [B(16), -24, -13, .95], [B(16) + 1.6, -13, -13, .9], [B(19), -13, -13, .88], [48, -13, -13, .84]]
function spline(t, j) {
  let i = 0; while (i < KF.length - 2 && t > KF[i + 1][0]) i++
  const p0 = KF[Math.max(0, i - 1)], p1 = KF[i], p2 = KF[i + 1], p3 = KF[Math.min(KF.length - 1, i + 2)]
  const v = (p) => (j === 3 ? Math.log(p[3]) : p[j])
  const u = clamp((t - p1[0]) / (p2[0] - p1[0])), dt = p2[0] - p1[0]
  const m1 = (v(p2) - v(p0)) / Math.max(.001, p2[0] - p0[0]) * dt, m2 = (v(p3) - v(p1)) / Math.max(.001, p3[0] - p1[0]) * dt
  const h00 = 2 * u ** 3 - 3 * u ** 2 + 1, h10 = u ** 3 - 2 * u ** 2 + u, h01 = -2 * u ** 3 + 3 * u ** 2, h11 = u ** 3 - u ** 2
  const r = h00 * v(p1) + h10 * m1 + h01 * v(p2) + h11 * m2
  return j === 3 ? Math.exp(r) : r
}
// ---------- the three cities and the routes between them ----------
const CITY = { lagos: [3.4, 6.45], ba: [-58.4, -34.6], sp: [-46.6, -23.55] }
function arc(a, b, bulge, side) {
  const A = [wx(a[0]), wy(a[1])], Bp = [wx(b[0]), wy(b[1])], mx = (A[0] + Bp[0]) / 2, my = (A[1] + Bp[1]) / 2, dx = Bp[0] - A[0], dy = Bp[1] - A[1], L = Math.hypot(dx, dy)
  let nx = -dy / L, ny = dx / L; if ((side === 'north' && ny > 0) || (side === 'east' && nx < 0)) { nx = -nx; ny = -ny }
  const C = [mx + nx * L * bulge, my + ny * L * bulge], pts = []
  for (let i = 0; i <= 160; i++) { const u = i / 160; pts.push([(1 - u) ** 2 * A[0] + 2 * (1 - u) * u * C[0] + u * u * Bp[0], (1 - u) ** 2 * A[1] + 2 * (1 - u) * u * C[1] + u * u * Bp[1]]) }
  return pts
}
const ROUTES = { lb: arc(CITY.lagos, CITY.ba, .16, 'north'), ls: arc(CITY.lagos, CITY.sp, .12, 'north'), sb: arc(CITY.sp, CITY.ba, .22, 'east') }
const at = (pts, f) => { const x = clamp(f) * (pts.length - 1), i = Math.min(pts.length - 2, Math.floor(x)), k = x - i; return [lerp(pts[i][0], pts[i + 1][0], k), lerp(pts[i][1], pts[i + 1][1], k), Math.atan2(pts[i + 1][1] - pts[i][1], pts[i + 1][0] - pts[i][0])] }
const SHIP_T0 = B(6), SHIP_T1 = B(9)
const shipF = (t) => smooth((t - SHIP_T0) / (SHIP_T1 - SHIP_T0)) * .985 + .0075

let CAM = { x: 0, y: 0, z: 1 }
function camera(t) {
  let x = wx(spline(t, 1)), y = wy(spline(t, 2)), z = spline(t, 3)
  const w = inout(t, SHIP_T0 - .4, SHIP_T1 - .2, 1.1) // follow the ship across the ocean
  if (w > 0) { const [sx, sy] = at(ROUTES.lb, shipF(t)); x = lerp(x, sx - 60, w); y = lerp(y, sy + 20, w); z = lerp(z, 1.55, w) }
  CAM = { x, y, z }
}
const pj = (X, Y) => [960 + (X - CAM.x) * CAM.z, 540 + (Y - CAM.y) * CAM.z]
const pjp = (pts) => pts.map(([X, Y]) => pj(X, Y))

// ---------- drawing helpers (screen space) ----------
function txt(s, x, y, size, color, alpha = 1, o = {}) { if (alpha <= .003) return; g.save(); g.globalAlpha *= alpha; g.fillStyle = color; g.font = `${o.italic ? 'italic ' : ''}${o.weight || 400} ${size}px ${o.font || SERIF}`; g.textAlign = o.align || 'center'; g.textBaseline = 'middle'; if (o.spacing) g.letterSpacing = o.spacing + 'px'; if (o.glow) { g.shadowColor = o.glow; g.shadowBlur = 22 } g.fillText(s, x, y); g.restore() }
function dot(x, y, r, color, a = 1) { if (a <= 0) return; const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, color); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.save(); g.globalAlpha *= a; g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill(); g.restore() }
function polyline(pts, f, color, width, alpha = 1, dash = null) {
  if (f <= 0 || alpha <= 0) return null
  const n = Math.max(2, Math.floor(clamp(f) * (pts.length - 1)) + 1)
  g.save(); g.globalAlpha *= alpha; g.strokeStyle = color; g.lineWidth = width; g.lineCap = 'round'; g.lineJoin = 'round'; if (dash) g.setLineDash(dash)
  g.beginPath(); for (let i = 0; i < n; i++) (i ? g.lineTo : g.moveTo).call(g, pts[i][0], pts[i][1])
  const tail = at(pts, f); g.lineTo(tail[0], tail[1]); g.stroke(); g.restore(); return tail
}
const NB = 13, A0 = Math.PI * 1.07, A1 = Math.PI * 1.93
function fan(x, cx, cy, r, color, open = 1) { x.fillStyle = color; const w = (A1 - A0) / NB
  for (let i = 0; i < NB; i++) { const s = A0 + i * w * open + .014, e = A0 + (i + 1) * w * open - .014; x.beginPath(); x.moveTo(cx + Math.cos(s) * r * .06, cy + Math.sin(s) * r * .06); x.lineTo(cx + Math.cos(s) * r, cy + Math.sin(s) * r); x.lineTo(cx + Math.cos(e) * r, cy + Math.sin(e) * r); x.lineTo(cx + Math.cos(e) * r * .06, cy + Math.sin(e) * r * .06); x.fill() }

function compass(t) {

  g.fillStyle = '#efe1bd'; g.beginPath(); g.arc(0, 0, r * .16, 0, TAU); g.fill(); g.stroke()
  fan(g, 0, r * .035, r * .13, GOLD)

  g.save(); g.rotate(rot); g.fillText('N', 0, -r * 1.14); g.restore()
  g.restore()

function ship(x, y, ang, s, a) {
  g.save(); g.globalAlpha = a; g.translate(x, y); g.rotate(ang); g.scale(s, s)
  g.fillStyle = INK; g.beginPath(); g.moveTo(-22, 0); g.quadraticCurveTo(0, 9, 24, -2); g.lineTo(18, -4); g.lineTo(-20, -4); g.closePath(); g.fill()
  g.strokeStyle = INK; g.lineWidth = 1.6; g.beginPath(); g.moveTo(-2, -4); g.lineTo(-2, -36); g.moveTo(10, -4); g.lineTo(10, -28); g.stroke()
  g.fillStyle = '#f3e7c8'; g.strokeStyle = INK; g.lineWidth = 1.3
  for (const [mx, top, wdt] of [[-2, -34, 15], [10, -26, 11]]) { g.beginPath(); g.moveTo(mx + 1, top); g.quadraticCurveTo(mx + wdt, top + 10, mx + 1, -8); g.closePath(); g.fill(); g.stroke() }

function city(key, name, sub, t0, t, dir = 1) {
  const a = smooth((t - t0) / .5); if (a <= 0) return
