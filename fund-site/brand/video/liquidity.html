<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#080706}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script src="teaser-assets/hands.js"></script>
<script>
// "Let There Be Liquidity": one engraved gold line (a banknote's guilloche) morphs through the whole film: a
// rosette, the share-price chart (on-chain, season 2: 29 Oct - 6 Nov), two markets with a gap, the spark between the hands
// of the Genesis pass, a gold coin (season 2 since 29 Oct 11:31 UTC to 6 Nov 16:34 UTC: 1,830 trades, 77% profitable, +$153.78 before
// gas, counted on-chain the way Telegram's /today does; share price $1.0000 -> $1.6677 from the vault), and the guilloche
// border of a Genesis certificate. One camera, never cut. 48 s, timed to score-liquidity.py (70 BPM: a bar is 3.43 s).
const P = new URLSearchParams(location.search)
const W = +(P.get('w') || 1920), H = +(P.get('h') || 1080)
const c = document.getElementById('c'); c.width = W; c.height = H
const g = c.getContext('2d')
const DUR = 48, BAR = 4 * 60 / 70
const GOLD = '#D4AF37', GOLD2 = '#F3D77A', DEEP = '#8a6a1c', WHITE = '#F4F1EA', SOFT = '#d9d0bd', INK = '#2a2117'
const SERIF = 'Caladea, "Liberation Serif", serif', MONO = '"JetBrains Mono", monospace', SANS = 'Inter, sans-serif'
const TAU = Math.PI * 2
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const lerp = (a, b, k) => a + (b - a) * k
const smooth = (x) => { x = clamp(x); return x * x * x * (x * (x * 6 - 15) + 10) }
const inout = (t, a, b, f = .9) => smooth((t - a) / f) * (1 - smooth((t - b) / f))
const R = (s) => () => { s |= 0; s = (s + 0x6d2b79f5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296 }
const B = (n) => n * BAR

// ---------- pre-rendered: marble, film grain, the hands ----------
let MARBLE = null, GRAIN = [], HANDS = null
function build() {
  const m = document.createElement('canvas'); m.width = 1300; m.height = 760; const x = m.getContext('2d'), id = x.createImageData(1300, 760), d = id.data
  const turb = (X, Y) => Math.sin(X * .011 + Math.sin(Y * .017) * 2.2) * .5 + Math.sin(X * .023 - Y * .019 + Math.sin(X * .007) * 3) * .3 + Math.sin((X + Y) * .041) * .2
  for (let Y = 0; Y < 760; Y++) for (let X = 0; X < 1300; X++) {
    const w = turb(X * .35, Y * .35) * .9 + turb(Y * .2, X * .2) * .4
    const v = Math.abs(Math.sin((X * .55 + Y) * .0032 + w * 1.4)), vein = Math.pow(1 - v, 34), fine = Math.pow(1 - Math.abs(Math.sin((X - Y * .4) * .0061 + w * 2.0)), 70)
    const base = 13 + 5 * turb(X * .15, Y * .15), lum = base + vein * 38 + fine * 12, i = (Y * 1300 + X) * 4
    d[i] = lum * 1.0 + vein * 12; d[i + 1] = lum * .93 + vein * 6; d[i + 2] = lum * .82; d[i + 3] = 255 }
  x.putImageData(id, 0, 0)
  const mb = document.createElement('canvas'); mb.width = 2600; mb.height = 1520; const y = mb.getContext('2d'); y.filter = 'blur(5px)'; y.drawImage(m, 0, 0, 2600, 1520); MARBLE = mb
  const r = R(7)
  for (let k = 0; k < 4; k++) { const n = document.createElement('canvas'); n.width = 480; n.height = 270; const z = n.getContext('2d'), gd = z.createImageData(480, 270)
    for (let i = 0; i < gd.data.length; i += 4) { const v = 128 + (r() - .5) * 90; gd.data[i] = gd.data[i + 1] = gd.data[i + 2] = v; gd.data[i + 3] = 255 } z.putImageData(gd, 0, 0); GRAIN.push(n) }
  return new Promise((res) => { const im = new Image(); im.onload = () => { HANDS = im; res() }; im.src = IMG.hands })
}

// ---------- the line field: N engraved lines, each M points, morphing between shapes ----------
const N = 46, M = 420
const PRICE = [1.0000, 1.2120, 1.2460, 1.2996, 1.4235, 1.4606, 1.5072, 1.5642, 1.6677]
const DAYS = ['29 Oct', '30 Oct', '31 Oct', '1 Nov', '2 Nov', '3 Nov', '4 Nov', '5 Nov', 'today']
const chartX = (u) => lerp(-900, 900, u)
const NS = PRICE.length - 1
const chartY = (u) => { const f = u * NS, i = Math.min(NS - 1, Math.floor(f)), k = f - i, e = (1 - Math.cos(Math.PI * k)) / 2; return 260 - (lerp(PRICE[i], PRICE[i + 1], e) - 1) / .7 * 520 }
const SHAPES = {
  rosette: (i, u, t, s = 1) => { const a = u * TAU, ph = i / N, r = (300 + 70 * Math.sin(12 * a + ph * 2.2 + t * .15) + 26 * Math.sin(5 * a - ph * 1.3)) * (.86 + .14 * ph) * s; return [Math.cos(a) * r, Math.sin(a) * r] },
  chart: (i, u, t) => [chartX(u), chartY(u) + (i - N / 2) * 2.6 + Math.sin(u * 60 + i * .7) * 1.6],
  waves: (i, u, t) => { const top = i < N / 2, j = top ? i : i - N / 2, x = chartX(u), ph = u * 6.5 - t * .9
    return [x, top ? -170 + 55 * Math.sin(ph) + 18 * Math.sin(ph * 2.3 + 1) + j * 2.4 : 170 + 55 * Math.sin(ph + .5) + 18 * Math.sin(ph * 2.1) - j * 2.4] },
  spark: (i, u, t) => { const a = u * TAU, r = 6 + i * .5 + 3 * Math.sin(a * 9 + t * 3 + i); return [Math.cos(a) * r, Math.sin(a) * r] },
  coin: (i, u, t) => { const a = u * TAU, r = 150 + i * 2.2, spin = Math.cos(t * .55); return [Math.cos(a) * r * (.25 + .75 * Math.abs(spin)), Math.sin(a) * r] },
  border: (i, u, t) => { const w = 1340 - i * 5.5, h = 780 - i * 5.5, per = 2 * (w + h), s = u * per; let x, y
    if (s < w) { x = -w / 2 + s; y = -h / 2 } else if (s < w + h) { x = w / 2; y = -h / 2 + (s - w) } else if (s < 2 * w + h) { x = w / 2 - (s - w - h); y = h / 2 } else { x = -w / 2; y = h / 2 - (s - 2 * w - h) }
    const wob = 5 * Math.sin(u * 220 + i * .5); return [x + (Math.abs(y) === h / 2 ? 0 : Math.sign(x) * wob), y + (Math.abs(y) === h / 2 ? Math.sign(y) * wob : 0)] },
  seal: (i, u, t) => SHAPES.rosette(i, u, t, .42),
}
// the sequence: [shape, time it is fully formed]
const SEQ = [['rosette', 4.6], ['chart', B(2) + 1.4], ['waves', B(4) + 2.0], ['spark', B(6) + 1.6], ['coin', B(8) + 1.3], ['border', B(10) + 1.4], ['seal', B(12) + 1.4]]
const MORPH = 2.4 // seconds each morph takes
function lineState(t) {
  let i = 0; while (i < SEQ.length - 1 && t >= SEQ[i + 1][1] - MORPH) i++
  const [a] = SEQ[i], next = SEQ[Math.min(SEQ.length - 1, i + 1)], b = next[0], start = next[1] - MORPH
  const p = i === SEQ.length - 1 ? 0 : clamp((t - start) / MORPH)
  return { a, b, p }
}
function drawLines(t, color, alpha, width = 1.15) {
  const { a, b, p } = lineState(t), draw = smooth(t / 4.2) // the first rosette draws itself in
  g.save(); g.strokeStyle = color; g.lineWidth = width; g.lineJoin = 'round'
  for (let i = 0; i < N; i++) {
    const k = smooth(clamp((p - (i / N) * .35) / .65)), sw = Math.sin(Math.PI * k) // stagger; a swirl mid-morph
    const n = Math.max(2, Math.floor(M * (t < 4.2 ? clamp(draw * 1.25 - i / N * .25) : 1))); if (n < 3) continue
    g.globalAlpha = alpha * (.42 + .4 * Math.sin(i * .37 + t * .4) ** 2)
    g.beginPath()
    for (let j = 0; j < n; j++) { const u = j / (M - 1), [x0, y0] = SHAPES[a](i, u, t), [x1, y1] = SHAPES[b](i, u, t)
      const x = lerp(x0, x1, k) + sw * 40 * Math.sin(u * 9 + i * .3 + t), y = lerp(y0, y1, k) + sw * 40 * Math.cos(u * 7 - i * .2 + t)
      j ? g.lineTo(x, y) : g.moveTo(x, y) }
    g.stroke()
  }
  g.restore()
}
// ---------- camera: a spline through keyframes [t, x, y, zoom, rotation] (world = 1920 x 1080 around 0,0) ----------
const KF = [[0, 0, 0, .78, -.06], [4.6, 0, 0, .9, -.02], [B(2) - .3, -60, 30, .95, 0], [B(2) + 1.6, -560, 90, 1.2, .015], [B(4) + .1, 720, -190, 1.2, .02],
  [B(4) + 1.2, 0, 0, .92, 0], [B(6) - .4, 0, 0, 1.0, -.01], [B(6) + 1.8, 0, 0, 1.55, 0], [B(8) - .2, 0, 0, 1.65, .01], [B(8) + 1.3, 160, 0, 1.2, 0],
  [B(10) - .3, 140, 0, 1.12, -.01], [B(10) + 1.6, 0, 0, .78, 0], [B(12) - .3, 0, 0, .8, .01], [B(12) + 1.4, 0, -40, 1.0, 0], [48, 0, -40, 1.06, 0]]
function spline(t, j) {
  let i = 0; while (i < KF.length - 2 && t > KF[i + 1][0]) i++
  const p0 = KF[Math.max(0, i - 1)], p1 = KF[i], p2 = KF[i + 1], p3 = KF[Math.min(KF.length - 1, i + 2)]
  const v = (p) => (j === 3 ? Math.log(p[3]) : p[j]), u = clamp((t - p1[0]) / (p2[0] - p1[0])), dt = p2[0] - p1[0]
  const m1 = (v(p2) - v(p0)) / Math.max(.001, p2[0] - p0[0]) * dt, m2 = (v(p3) - v(p1)) / Math.max(.001, p3[0] - p1[0]) * dt
  const r = (2 * u ** 3 - 3 * u ** 2 + 1) * v(p1) + (u ** 3 - 2 * u ** 2 + u) * m1 + (-2 * u ** 3 + 3 * u ** 2) * v(p2) + (u ** 3 - u ** 2) * m2
  return j === 3 ? Math.exp(r) : r
}
let CAM = { x: 0, y: 0, z: 1, r: 0 }
const toScreen = () => { g.translate(960, 540); g.rotate(CAM.r); g.scale(CAM.z, CAM.z); g.translate(-CAM.x, -CAM.y) }

// ---------- pieces ----------
function txt(s, x, y, size, color, alpha = 1, o = {}) { if (alpha <= .003) return; g.save(); g.globalAlpha *= alpha; g.fillStyle = color; g.font = `${o.italic ? 'italic ' : ''}${o.weight || 400} ${size}px ${o.font || SERIF}`; g.textAlign = o.align || 'center'; g.textBaseline = 'middle'; if (o.spacing) g.letterSpacing = o.spacing + 'px'; if (o.glow) { g.shadowColor = o.glow; g.shadowBlur = 24 } g.fillText(s, x, y); g.restore() }
function dot(x, y, r, color, a = 1) { if (a <= 0) return; const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, color); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.save(); g.globalAlpha *= a; g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill(); g.restore() }
const NB = 13, A0 = Math.PI * 1.07, A1 = Math.PI * 1.93
function fan(cx, cy, r, color, a = 1, open = 1) { if (a <= 0) return; g.save(); g.globalAlpha *= a; g.fillStyle = color; const w = (A1 - A0) / NB
  for (let i = 0; i < NB; i++) { const s = A0 + i * w * open + .012, e = A0 + (i + 1) * w * open - .012; g.beginPath(); g.moveTo(cx + Math.cos(s) * r * .06, cy + Math.sin(s) * r * .06); g.lineTo(cx + Math.cos(s) * r, cy + Math.sin(s) * r); g.lineTo(cx + Math.cos(e) * r, cy + Math.sin(e) * r); g.lineTo(cx + Math.cos(e) * r * .06, cy + Math.sin(e) * r * .06); g.fill() }
  g.strokeStyle = color; g.lineWidth = r * .05; g.beginPath(); g.arc(cx, cy + r * .05, r * .06, 0, TAU); g.stroke(); g.restore() }
function microRing(r, text, size, a, rot) { if (a <= 0) return; g.save(); g.globalAlpha = a; g.rotate(rot); g.font = `600 ${size}px ${MONO}`; g.fillStyle = GOLD; g.textAlign = 'center'; g.textBaseline = 'middle'
  const n = Math.floor(TAU * r / (size * .78)); for (let k = 0; k < n; k++) { g.save(); g.rotate(k / n * TAU); g.fillText(text[k % text.length], 0, -r); g.restore() } g.restore() }

function chartLabels(t) {
  const a = inout(t, B(2) + .6, B(4) - .6); if (a <= 0) return
  DAYS.forEach((d, i) => { const u = i / NS, x = chartX(u), y = chartY(u), k = a * smooth((t - B(2) - .4 - i * .25) / .5)
    dot(x, y, 22, 'rgba(243,215,122,.7)', k); txt(d, x, y + 74, 22, SOFT, k, { font: MONO }); txt(`$${PRICE[i].toFixed(2)}`, x, y - 50, 24, GOLD2, k * (i === 0 || i === NS ? 1 : .7), { font: MONO, weight: 600 }) })
}
function waveLabels(t) {
  const a = inout(t, B(4) + 1.4, B(6) - .7); if (a <= 0) return
  txt('UNISWAP', -800, -250, 24, SOFT, a, { font: MONO, spacing: 8, align: 'left' }); txt('TEXTILE', -800, 260, 24, SOFT, a, { font: MONO, spacing: 8, align: 'left' })
  const pulse = .6 + .4 * Math.sin(t * 2.4) ** 2; dot(0, 0, 160, 'rgba(243,215,122,.55)', a * pulse)
  txt('the gap', 0, 0, 28, GOLD2, a, { italic: true })
}
function hands(t) {
  const a = inout(t, B(6) - 1.0, B(8) + .3, 1.6); if (a <= 0 || !HANDS) return
  const reach = smooth((t - B(6) + 1) / 5.5), w = 2000, h = 506, gx = 1005, gy = 252 // gap between the fingertips, in image px
  const sc = 1.05, close = (1 - reach) * 90
  g.save(); g.globalAlpha = a
  // left hand (God's) and right hand (Adam's) drawn as two halves so they can drift toward each other
  g.drawImage(HANDS, 0, 0, gx, h, -gx * sc - close, -gy * sc, gx * sc, h * sc)
  g.drawImage(HANDS, gx, 0, w - gx, h, close, -gy * sc, (w - gx) * sc, h * sc)
  g.restore()
}
function sparkGlow(t) {
  const a = inout(t, B(6) + .6, B(8) + 1.0, 1.0); if (a <= 0) return
  const fl = .75 + .25 * Math.sin(t * 7) * Math.sin(t * 3.1)
  dot(0, 0, 180, 'rgba(255,214,120,.35)', a * fl); dot(0, 0, 60, 'rgba(255,246,220,.95)', a * fl)
  for (let k = 0; k < 12; k++) { const an = k / 12 * TAU + t * .3, len = 40 + 30 * Math.sin(t * 4 + k); g.save(); g.globalAlpha = a * .5; g.strokeStyle = GOLD2; g.lineWidth = 1.5; g.beginPath(); g.moveTo(Math.cos(an) * 18, Math.sin(an) * 18); g.lineTo(Math.cos(an) * len, Math.sin(an) * len); g.stroke(); g.restore() }
}
function coin(t) {
  const a = inout(t, B(8) + .4, B(10) + .2, 1.0); if (a <= 0) return
  const spin = Math.cos(t * .55), sx = .25 + .75 * Math.abs(spin), r = 140
  g.save(); g.globalAlpha = a; g.scale(sx, 1)
  const gr = g.createRadialGradient(-r * .35, -r * .4, r * .1, 0, 0, r * 1.05); gr.addColorStop(0, '#fff1bf'); gr.addColorStop(.35, GOLD2); gr.addColorStop(.75, GOLD); gr.addColorStop(1, DEEP)
  g.fillStyle = gr; g.beginPath(); g.arc(0, 0, r, 0, TAU); g.fill()
  g.strokeStyle = 'rgba(90,64,16,.6)'; g.lineWidth = 3; g.beginPath(); g.arc(0, 0, r * .86, 0, TAU); g.stroke()
  fan(2, r * .08 + 2, r * .5, 'rgba(90,64,16,.55)'); fan(-1.5, r * .08 - 1.5, r * .5, 'rgba(255,248,220,.6)'); fan(0, r * .08, r * .5, '#c79b2c')
  // a specular sweep across the face
  const sw = ((t * .35) % 1.6) - .3; const lg = g.createLinearGradient(-r + sw * 2 * r, -r, -r + sw * 2 * r + 80, r); lg.addColorStop(0, 'rgba(255,255,255,0)'); lg.addColorStop(.5, 'rgba(255,255,255,.35)'); lg.addColorStop(1, 'rgba(255,255,255,0)')
  g.globalCompositeOperation = 'source-atop'; g.fillStyle = lg; g.fillRect(-r, -r, 2 * r, 2 * r)
  g.restore()
  const k = smooth((t - B(8) - 1.2) / .8) * (1 - smooth((t - B(10) + .4) / .8))
  txt('SEASON 2 · SINCE 29 OCT', 260, -86, 22, SOFT, k, { font: MONO, spacing: 6, align: 'left' }); txt('1,830 trades', 260, -32, 52, WHITE, k, { weight: 700, align: 'left' }); txt('+$153.78 before gas', 260, 24, 30, GOLD2, k, { font: MONO, weight: 600, align: 'left' }); txt('77% profitable · share price +67%', 260, 70, 22, SOFT, k, { font: MONO, align: 'left' })
}
function certificate(t) {
  const a = inout(t, B(10) + .6, B(12) + .4, 1.2); if (a <= 0) return
  g.save(); g.globalAlpha = a * .92; g.shadowColor = 'rgba(0,0,0,.6)'; g.shadowBlur = 60; g.shadowOffsetY = 26
  const gr = g.createLinearGradient(-700, -410, 700, 410); gr.addColorStop(0, '#efe4c6'); gr.addColorStop(1, '#ddcfa8'); g.fillStyle = gr; g.fillRect(-700, -410, 1400, 820); g.restore()
  const k = (d) => a * smooth((t - B(10) - 1.2 - d) / .7)
  txt('THE GENESIS PASS', 0, -250, 30, INK, k(0), { spacing: 18, weight: 700 })
  txt('MIDAS × KIYOSHI', 0, -150, 84, INK, k(.2), { weight: 700, spacing: 12 })
  txt('a membership of the fund, on Celo', 0, -70, 30, '#5a4a36', k(.4), { italic: true })
  txt('Nº 001', -440, 210, 34, INK, k(.6), { font: MONO, weight: 600 })
  txt('IN CODE WE TRUST', 0, 230, 26, '#5a4a36', k(.7), { spacing: 10 })
  // the seal: red, with the fan
  const sk = k(.9); if (sk > 0) { g.save(); g.globalAlpha = sk; g.fillStyle = '#9c1e28'; g.beginPath(); g.arc(440, 200, 74, 0, TAU); g.fill(); g.restore(); fan(440, 210, 46, '#e8b8b0', sk * .85) }
}
function captions(t) {
  const C = [[.9, 4.9, 'Fiat lux.'], [B(2) - .1, B(4) - .2, 'Let there be liquidity.'], [B(4) + 1.2, B(6) - .8, 'Two markets, never quite equal.'],
    [B(6) + .4, B(8) - .5, 'Kiyoshi lives in the space between them.'], [B(8) + .5, B(10) - .6, 'One spark at a time.'], [B(10) + .8, B(12) - .4, 'Coming to the members of the fund.']]
  for (const [a, b, s] of C) txt(s, 960, 964, 50, WHITE, inout(t, a, b, .7), { italic: true, glow: 'rgba(0,0,0,.8)' })
}
function endCard(t) {
  const lt = t - B(12) - .2; if (lt < 0) return
  const a = smooth(lt / 1.2)
  fan(0, 10, 92, GOLD, a, smooth((lt - .2) / 1.2))
  txt('MIDAS × KIYOSHI', 0, 220, 76, WHITE, smooth((lt - .8) / .9), { weight: 700, spacing: 18 })
  txt('Let there be liquidity', 0, 296, 36, SOFT, smooth((lt - 1.4) / .9), { italic: true })
}
function draw(t) {
  CAM = { x: spline(t, 1), y: spline(t, 2), z: spline(t, 3), r: spline(t, 4) }
  const sc = W / 1920
  g.setTransform(sc, 0, 0, sc, 0, 0); g.fillStyle = '#080706'; g.fillRect(0, 0, 1920, 1080)
  // marble, far away: moves at half the camera's speed, softly out of focus
  g.save(); g.translate(960, 540); g.rotate(CAM.r * .5); g.scale(.55 + CAM.z * .35, .55 + CAM.z * .35); g.translate(-CAM.x * .5, -CAM.y * .5); g.globalAlpha = .75; g.drawImage(MARBLE, -1300, -760); g.restore()
  dot(960, 520, 900, 'rgba(255,214,140,.10)')
  // the world
  g.save(); toScreen()
  if (t > B(10) - .2) certificate(t)
  const ink = smooth((t - B(10) - .4) / 1.4) * (1 - smooth((t - B(12)) / 1.2)) // the lines turn to dark ink on the certificate
  const lineCol = ink > .5 ? '#5a4326' : GOLD2
  hands(t)
  drawLines(t, lineCol, t < B(12) + 1 ? 1 : 1, 1.15)
  if (t < 6.4) microRing(388, 'FIAT LUX · ', 13, inout(t, 1.6, 6.2, 1.0), t * .05)
  chartLabels(t); waveLabels(t); sparkGlow(t); coin(t); endCard(t)
  g.restore()
  captions(t)
  // film: grain, a gentle bloom of the highlights, vignette
  g.save(); g.globalCompositeOperation = 'overlay'; g.globalAlpha = .08; g.drawImage(GRAIN[Math.floor(t * 24) % 4], 0, 0, 1920, 1080); g.restore()
  g.setTransform(1, 0, 0, 1, 0, 0)
  const vg = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .38, W / 2, H / 2, Math.max(W, H) * .72); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.62)'); g.fillStyle = vg; g.fillRect(0, 0, W, H)
  g.globalAlpha = clamp(1 - t / .9) + clamp((t - (DUR - 1.4)) / 1.4); g.fillStyle = '#000'; g.fillRect(0, 0, W, H); g.globalAlpha = 1
}
window.draw = draw; window.DUR = DUR; window.READY = document.fonts.ready.then(() => build())
</script>
</body></html>
